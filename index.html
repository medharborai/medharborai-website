 pilot:{eye:"Rejoindre le pilote",h:"Participez au premier pilote",lead:"Laissez vos coordonnées et nous vous contacterons quand le prototype sera prêt à être testé. C'est gratuit et sans engagement.",role:"Vous êtes",roles:["Patient ou proche","Médecin ou autre professionnel de santé","Une organisation (clinique, assureur, ONG, société de mobilité)","Financeur ou investisseur","Autre"],name:"Nom",email:"E-mail",country:"Pays de résidence",langs:"Langues de vos documents médicaux",msg:"Message (facultatif)",consent:"J'accepte que MedHarbor conserve ces informations pour me contacter au sujet du pilote, comme indiqué dans la",consentLink:"politique de confidentialité",send:"M'inscrire au pilote",sent:"Merci ! Vous êtes inscrit au pilote. Nous vous écrirons au début des tests.",nextH:"Ce qui se passe après votre inscription",next:["Nous confirmons votre inscription par e-mail.", "Dès que le financement est obtenu, nous construisons le prototype. Cela prend environ 12 semaines.", "Nous vous invitons à le tester et à nous donner votre avis."],auto:"Merci de vous être inscrit à la liste du pilote MedHarbor. Nous vous écrirons au début des tests. MedHarbor, medharborai.com",auto2:"Merci pour votre message à MedHarbor. Nous vous répondrons bientôt par e-mail. MedHarbor, medharborai.com",sending:"Envoi en cours…",openApp:"Ouvrir la messagerie",mailNote:"Votre application de messagerie devrait s'ouvrir avec le message prêt. Appuyez sur Envoyer pour terminer. Rien n'a encore été envoyé.",mailHint:"Un clic ouvre votre messagerie avec le message déjà rempli. C'est vous qui l'envoyez.",gmail:"Ouvrir dans Gmail",copyText:"Copier le message",noApp:"Aucune messagerie ne s'est ouverte ?",copied2:"Message copié. Collez-le dans un nouvel e-mail à",fail:"Le message n'a pas pu être envoyé. Réessayez ou écrivez-nous à contact@medharborai.com.",btns:["M'inscrire au pilote", "M'inscrire au pilote", "Discuter d'un partenariat", "Contacter le fondateur", "Envoyer le message"],sentMsg:"Merci ! Nous avons bien reçu votre message et vous répondrons par e-mail.",consent2:"J'accepte que MedHarbor conserve ces informations pour répondre à mon message, comme indiqué dans la",org:"Organisation",err:"Veuillez corriger les champs signalés.",vName:"Indiquez votre nom : uniquement des lettres, au moins 2.",vEmail:"Indiquez une adresse e-mail valide, par exemple nom@exemple.fr.",vCountry:"Choisissez votre pays.",vOrg:"Indiquez le nom de votre organisation.",vMsg:"Le message peut contenir jusqu'à 1000 caractères, sans < ni >.",vConsent:"Cochez la case pour donner votre accord.",pickCountry:"Choisir un pays",langsHint:"Sélectionnez toutes celles qui conviennent",other:"Autre",direct:"Des questions ? Écrivez au fondateur",copy:"Copier",copied:"Copié",whyH:"Pourquoi participer",why:[["Patients et familles","Testez la fiche parmi les premiers avec vos propres documents, gratuitement."],["Médecins","Aidez-nous à décider ce que la fiche affiche et comment elle se présente."],["Organisations","Préparons ensemble un pilote pour vos membres, vos salariés ou vos clients."],["Financeurs","Recevez les résultats du pilote et la présentation complète du projet."]]},
 legal:{privacy:{h:"Politique de confidentialité",u:"Dernière mise à jour : novembre 2026",s:[["Responsable du traitement",FOUNDER+", fondateur du projet MedHarbor (medharborai.com). Contact : contact@medharborai.com."],["Ce que ce site collecte","Uniquement ce que vous nous envoyez via le formulaire du pilote ou par e-mail : nom, e-mail, pays, rôle, langues de vos documents et votre message. Ce site ne collecte aucune donnée de santé. Le formulaire n'envoie rien depuis ce site : il ouvre votre messagerie avec un message prêt, qui ne nous parvient que lorsque vous appuyez sur Envoyer."],["Pourquoi","Pour vous contacter au sujet du pilote MedHarbor et des nouvelles du projet. Base légale : votre consentement (article 6, paragraphe 1, point a du RGPD)."],["Combien de temps","Jusqu'à la fin du pilote ou jusqu'à ce que vous demandiez leur suppression, selon ce qui arrive en premier."],["Vos droits","Vous pouvez demander l'accès à vos données, leur rectification, leur effacement, la limitation de leur traitement ou leur portabilité, vous opposer à leur traitement et retirer votre consentement à tout moment. Écrivez à contact@medharborai.com. Vous pouvez aussi saisir l'autorité de protection des données de votre pays."],["La future application","L'application MedHarbor n'existe pas encore. Avant son lancement, elle aura sa propre politique de confidentialité pour les données de santé."]]},imprint:{h:"Mentions légales",u:"",s:[["Responsable de la publication",FOUNDER+", fondateur du projet MedHarbor"],["Contact","contact@medharborai.com"],["Société","MedHarbor n'est pas encore immatriculé en tant que société. Les informations légales seront ajoutées ici après l'immatriculation."]]}},

 problem:{eye:"El problema",h:"Cada vez que cambias de país, tu historial médico vuelve a empezar de cero",lead:"Cuando te mudas a otro país, tu nuevo médico no puede aprovechar tus informes médicos. Eso lleva a pruebas repetidas, alergias que se pasan por alto y errores con la medicación.",items:[["Documentos que el nuevo médico no puede leer","Informes de alta, análisis y recetas en papel o en PDF, en distintos idiomas y alfabetos. Muchas veces escritos a mano."],["Poco tiempo para leerlos", "Un médico tiene solo unos minutos por paciente. Nadie tiene tiempo de leer cuarenta páginas en otro idioma. Así se pierden datos importantes."],["El mismo medicamento con otro nombre","Las marcas, las dosis y las normas de receta cambian de un país a otro. Traducir la etiqueta no basta."]]},

 numbers:{eye:"Las cifras",h:"Millones de personas en Europa tienen un historial médico que su médico no puede leer",stats:[["30,6 M","ciudadanos de fuera de la UE viven en la UE","Eurostat · 1 ene 2025"],["14,1 M","ciudadanos de la UE viven en otro país de la UE","Eurostat · 1 ene 2025"],["4,43 M","personas de Ucrania tienen protección temporal en la UE","Eurostat · ago 2026"],["2029","los países de la UE empezarán a intercambiar resúmenes de pacientes, pero solo entre ellos y solo en formato digital","Reglamento EHDS"]]},
 how:{eye:"Cómo funcionará",h:"Del cajón lleno de papeles a una sola ficha, en minutos",steps:[["Sube tus documentos","Fotos, escaneos o PDF en cualquier idioma, incluso escritos a mano."],["La IA los lee","MedHarbor reconocerá cada documento y sacará diagnósticos, medicación, alergias, resultados de análisis y vacunas, con sus códigos médicos internacionales."],["Tú lo revisas","En cada dato verás lo segura que está la IA y un enlace a la página original. Las alergias y la medicación siempre las confirmas tú."],["Compártelo con tu médico","La ficha se crea en el idioma de tu médico. Compártela con un código QR, un enlace temporal o en PDF."]]},

 modules:{eye:"Funciones previstas",h:"Una sola herramienta para todo el camino",items:[["Ficha de paciente","Todos tus informes en un resumen con el formato internacional Patient Summary. Primero las alergias y la medicación, después todo el historial."],["Medicamentos en otro país","Escribe el nombre de un medicamento de tu país anterior. Verás qué principio activo lleva, cómo se llama donde vives ahora y si necesita receta."],["Ayuda en la consulta","Prepara tus preguntas, ten traducción durante la consulta y guarda después un resumen en los dos idiomas."]]},
 why:{eye:"Por qué ahora",h:"La tecnología está lista y Europa se pone de acuerdo en reglas comunes",items:[["La IA ya sabe leer documentos reales","La IA actual lee escaneos, letra a mano y distintos alfabetos por unos céntimos por documento."],["Europa adopta un formato común","El Espacio Europeo de Datos Sanitarios (EHDS) usa el International Patient Summary como formato común. MedHarbor lo usará desde el principio."],["Lo que el EHDS no cubre","El sistema oficial solo conectará datos digitales dentro de la UE. Los informes en papel y los documentos de países de fuera de la UE se quedan fuera. Para esos casos está pensado MedHarbor."],["Reglas claras para la IA en salud","El RGPD y el Reglamento europeo de IA marcan reglas claras. Las cumplimos desde el primer día."]]},
 road:{eye:"Hoja de ruta",h:"Qué traerá la fase de prototipo",lead:"Doce semanas hasta tener un prototipo que funcione, probado por usuarios y médicos reales. Los resultados decidirán el siguiente paso.",phases:[["Ahora","Concepto y validación","Conversaciones con pacientes y médicos, revisión legal, diseño del prototipo, búsqueda de socios."],["Semanas 1–2","Investigación y diseño","15 entrevistas con pacientes y 5 con médicos, 200 documentos de prueba anonimizados, análisis de MDR y RGPD."],["Semanas 3–9","Construcción del prototipo","Subida de documentos, IA que lee y ordena los datos, pantalla de revisión, ficha en 5 idiomas."],["Semanas 10–11","Piloto cerrado","Entre 30 y 50 usuarios y entre 5 y 10 médicos prueban fichas reales."],["Semana 12","Resultados","Informe de resultados, decisión sobre los siguientes pasos, solicitud de más financiación."]],
  kpiH:"Cómo mediremos el piloto",kcols:["Qué medimos","Objetivo"],kpis:[["Precisión, revisada por un médico","Al menos un 90 % de datos correctos, ningún error en alergias ni medicación"],["Usuarios que completan su ficha","Al menos un 60 %"],["Médicos que consideran útil la ficha","Al menos 7 de cada 10"],["Usuarios dispuestos a pagar por Plus","Al menos un 20 %"],["Usuarios activos tras 30 días","Al menos un 30 %"],["Cartas de intención de organizaciones","Al menos 2"]],
  riskH:"Principales riesgos y qué hacemos",rcols:["Riesgo","Qué hacemos"],risks:[["La IA se equivoca en un dato importante","El paciente revisa cada dato, cada dato enlaza con el original y las alergias y la medicación se prueban sin ningún margen de error"],["MedHarbor se considera producto sanitario","Un uso claramente limitado: organizar y traducir, nunca diagnosticar. Revisión legal antes del piloto"],["Filtración de datos de salud","Datos alojados en la UE, cifrado, acceso mínimo, sin entrenar la IA con datos de usuarios, prueba de seguridad antes del lanzamiento"],["Los médicos no confían en la ficha","Un formato que ya conocen, enlaces a los originales, médicos implicados desde la primera semana"],["Los refugiados no pueden pagar","Acceso gratuito financiado por ONG y subvenciones; ingresos de expatriados y organizaciones"]],more:"Ver la hoja de ruta completa"},
 impact:{eye:"Impacto",h:"A quién ayuda y por qué importa para Europa",lead:"MedHarbor ayuda a las personas cuyo historial médico está repartido entre varios países, y a los médicos que las atienden.",whoH:"Para quién",who:[["Refugiados y personas desplazadas","Suelen llegar con informes en papel en otro idioma y necesitan a la vez atención urgente y seguimiento a largo plazo."],["Expatriados y familias que se mudan","Cada mudanza supone un sistema sanitario nuevo. Empresas y aseguradoras ya pagan para hacerlo más fácil."],["Personas con enfermedades crónicas","Quienes tienen diabetes, problemas de corazón o cáncer acumulan más documentos y son quienes más sufren cuando falta algo."],["Familias que cuidan a distancia","Hijos adultos que, desde un país, gestionan la atención médica de sus padres en otro."],["Médicos y clínicas","Reciben un historial claro antes de la consulta, en lugar de un montón de páginas sin traducir."],["Aseguradoras y servicios públicos","Menos pruebas repetidas y menos errores de medicación evitables."]],alignH:"Cómo encaja con las prioridades de la UE",align:[["Espacio Europeo de Datos Sanitarios","Las fichas usan el International Patient Summary y HL7 FHIR, los formatos elegidos para el EHDS."],["Igualdad en el acceso a la salud","Contribuye a los Objetivos de Desarrollo Sostenible 3 (salud) y 10 (reducción de las desigualdades) al eliminar la barrera del idioma."],["Una IA de confianza","Cada resultado se puede comprobar y lo confirma una persona, como pide el Reglamento europeo de IA."],["Los datos se quedan en Europa","Alojamiento en la UE, RGPD desde el diseño, y es el usuario quien decide quién ve su ficha."]],outH:"Qué queremos cambiar",out:[["Menos pruebas repetidas","Los médicos ven los resultados anteriores en vez de volver a pedirlos."],["Recetas más seguras","Las alergias y la medicación actual aparecen en la primera página, en el idioma del médico."],["Consultas más ágiles","El médico tiene un resumen antes de la consulta y no tiene que volver a preguntarlo todo."]]},
 model:{eye:"Modelo de negocio",h:"Gratis para quien más lo necesita",lead:"Este modelo es un plan. Lo probaremos en el piloto y los precios todavía pueden cambiar.",streams:[["Gratis para particulares","Lo básico: hasta 15 documentos, una ficha y un idioma de médico."],["Suscripción Plus","Unos 6–9 € al mes: documentos ilimitados, todos los idiomas, medicamentos en otro país y ayuda en la consulta."],["Organizaciones","Licencias para aseguradoras de salud internacionales, empresas de movilidad internacional y clínicas con pacientes extranjeros."],["Acceso patrocinado","ONG y programas públicos pagan para que los refugiados usen MedHarbor gratis."]],neverH:"Lo que nunca haremos",never:["Vender o compartir datos de salud","Mostrar publicidad o promocionar medicamentos","Cobrar comisiones a farmacias o laboratorios"],econ:"Procesar un documento con IA cuesta unos céntimos. Los costes reales están en llegar a los usuarios y controlar la calidad."},
 security:{eye:"Privacidad",h:"Cómo protegeremos tus datos",lead:"El RGPD exige la máxima protección para los datos de salud. Estos son nuestros compromisos para el producto que estamos creando. Todavía no existe.",items:[["Datos alojados en la UE","Documentos, datos extraídos y fichas se guardarán y procesarán solo en centros de datos de la UE."],["Siempre cifrados","Los datos estarán cifrados tanto al guardarlos como al enviarlos."],["Tu consentimiento expreso","Solo trataremos tus datos de salud con tu consentimiento expreso, y podrás retirarlo cuando quieras."],["Sin entrenar la IA con tus datos","Por contrato, nuestros proveedores de IA no podrán usar tus documentos para entrenar sus modelos."],["Acceso mínimo","Solo tendrá acceso quien lo necesite, y cada acceso quedará registrado. Siempre que se pueda, los nombres se eliminarán antes de que la IA procese los documentos."],["Borra todo con un toque","Si eliminas tu cuenta, se borran todos tus documentos, datos y fichas."],["Tú decides qué compartir","Cada ficha compartida caduca cuando tú quieras, y puedes retirar el acceso en cualquier momento."],["Revisiones independientes","Evaluación de impacto en protección de datos y prueba de seguridad independiente antes de cualquier lanzamiento público."]],regH:"Marco legal",regCols:["Norma","Qué significa para MedHarbor"],reg:[["MDR (productos sanitarios)","MedHarbor organiza, traduce y comparte documentos. No diagnostica, no interpreta resultados y no da consejos de tratamiento. Habrá una revisión formal antes del piloto."],["RGPD, artículo 9","Consentimiento expreso, evaluación de impacto, solo los datos necesarios, alojamiento en la UE."],["Reglamento europeo de IA","El contenido generado por IA se señala claramente y se registran las versiones de los modelos."],["EHDS y HL7 FHIR","Las fichas usan el formato International Patient Summary para poder funcionar más adelante con otros sistemas sanitarios."]],note:"MedHarbor no será un producto sanitario ni dará consejo médico."},
 concept:{eye:"Concepto",h:"Todo lo que necesita un paciente cuando su atención médica cruza fronteras",lead:"Tres funciones alrededor de una sola ficha de paciente. El prototipo empieza por la ficha.",tag:"Previsto",tabs:["Ficha de paciente","Medicamentos en otro país","Ayuda en la consulta"],
  card:{h:"La ficha de paciente",p:"Todos tus informes en un solo sitio y bien ordenados. El médico ve primero lo importante: alergias, medicación actual y enfermedades crónicas. Después, todo el historial.",li:["Sube fotos, escaneos y PDF en cualquier idioma","El tipo de documento se reconoce solo: informe de alta, análisis, receta, cartilla de vacunación","Se extraen diagnósticos, medicación, alergias, resultados e intervenciones","Códigos internacionales: CIE-10, ATC, LOINC","Cada dato enlaza con su página en el original","Compártela en PDF, con código QR o con un enlace temporal"]},
  meds:{h:"Medicamentos en otro país",p:"El mismo medicamento puede tener otro nombre, otra dosis u otras normas de receta en otro país. MedHarbor te mostrará qué principio activo lleva tu medicamento y cómo se llama donde vives ahora.",li:["Busca por marca, principio activo o código ATC","Medicamentos autorizados en tu país actual","Con receta o sin receta","Dosis o presentación distintas, bien señaladas","Información para hablar con tu médico o farmacéutico, no una recomendación"],from:"Receta anterior",ing:"Principio activo",to:"Se vende en el nuevo país",rx:"Con receta"},
  visit:{h:"Ayuda en la consulta",p:"Las consultas son cortas y estresantes cuando no dominas el idioma. Esta función te ayudará a prepararte, traducirá durante la consulta y guardará lo más importante.",li:["Síntomas y preguntas preparados y traducidos antes de ir","Traducción en los dos sentidos, con vocabulario médico y texto en pantalla","Resumen en los dos idiomas al terminar","El resumen se añade a tu ficha","El audio se procesa en directo y no se guarda por defecto"]}},
 funders:{eye:"Para financiadores y socios",h:"Ayúdanos a construir MedHarbor",lead:"MedHarbor es un proyecto en fase inicial, impulsado por su fundador. Buscamos subvenciones y socios para construir y probar el prototipo.",snapH:"El proyecto en pocas líneas",snap:[["Proyecto","MedHarbor, un pasaporte médico con IA"],["Web","medharborai.com"],["Fase","Inicial: concepto y diseño del prototipo"],["Fundador",FOUNDER],["La financiación se destinará a","Desarrollo, diseño, revisión legal, revisión médica, piloto"],["Plazo","12 semanas desde la financiación hasta los resultados del piloto"],["Contacto","contact@medharborai.com"]],brief:"Resumen del proyecto (PDF, en inglés)",helpH:"Cómo puedes ayudar",help:[["Subvenciones y financiación inicial","Financiar el prototipo y el primer piloto."],["Socios para el piloto","Clínicas, aseguradoras, empresas de movilidad internacional y ONG que puedan aportar usuarios y médicos."],["Asesores","Médicos, expertos en derecho sanitario y protección de datos, ingenieros de IA."],["Cartas de apoyo","Una breve carta de intención refuerza nuestras solicitudes de subvención."]],cta:"Escribir al fundador"},
 about:{eye:"Quiénes somos",h:"La atención médica no debería detenerse en la frontera",lead:"MedHarbor nace de una observación sencilla: millones de personas en Europa guardan su historial médico en una carpeta de papeles que ningún médico local puede leer. Estamos creando un producto de IA para cambiarlo.",founderH:"Fundador",role:"Fundador y CEO",short:"Fundador y CEO. Antes trabajó en IA e interoperabilidad en SoftServe, Grammarly y Doctolib. Vive en Leópolis, Ucrania.",bio:["Pavlo Bulelik es el fundador y CEO de MedHarbor y vive en Leópolis, Ucrania. En casi ocho años ha trabajado donde la IA se encuentra con la sanidad: como ingeniero de aprendizaje automático en SoftServe, extrayendo datos de documentos clínicos escaneados para clientes del sector sanitario; en producto de PLN e IA generativa en Grammarly; y en producto de ecosistema e interoperabilidad en Doctolib, centrado en el intercambio transfronterizo de datos médicos en Europa.", "Fundó MedHarbor para resolver un problema que crece con cada mudanza al extranjero: el historial médico se queda atrás y el siguiente médico tiene que empezar de cero, a menudo en un idioma que no puede leer.", "Hoy MedHarbor está en fase pre-seed: el concepto y el diseño de la ficha de paciente están listos, el dominio y la página de empresa están creados, y el siguiente paso es un primer prototipo con documentos médicos reales, apoyado en subvenciones."],buildH:"Formando el equipo",buildLead:"De momento, MedHarbor lo lleva su fundador. Buscamos asesores y a las primeras personas del equipo para el prototipo.",open:"Puesto abierto",roles:[["Asesor médico","Un médico en ejercicio que revise la ficha y el vocabulario médico."],["Asesor legal y de protección de datos","Ayuda con el MDR, el RGPD y el Reglamento europeo de IA."],["Ingeniero de IA y full-stack","Construye el prototipo y la IA que lee los documentos."]],missionH:"Misión",mission:"Que el historial médico de cualquier persona sea comprensible para cualquier médico, en cualquier lugar, en minutos.",principlesH:"Nuestros principios",principles:[["Comprobable antes que convincente","Un resumen sin fuente es peor que no tener resumen. Cada dato enlaza con el original."],["Organizar, nunca diagnosticar","MedHarbor ordena y traduce. Las decisiones médicas las toman los pacientes y los médicos."],["Privacidad desde el diseño","El alojamiento en la UE, el consentimiento expreso y el borrado con un toque forman parte del producto, no de la letra pequeña."],["Estándares internacionales","Usamos FHIR y el International Patient Summary para que las fichas puedan funcionar con los sistemas de los médicos."]]},
 faq:{eye:"Preguntas",h:"Preguntas frecuentes",items:[["¿MedHarbor ya existe?","Todavía no. Estamos en la fase de concepto y diseño del prototipo, y estamos pidiendo subvenciones para construirlo y hacer un piloto cerrado. Ya puedes apuntarte a la lista del piloto."],["¿Será MedHarbor un producto sanitario?","No. MedHarbor ayudará a las personas a organizar, traducir y compartir sus propios documentos médicos. No hará diagnósticos, no interpretará resultados ni recomendará tratamientos."],["¿Cómo se garantizará que los datos son correctos?","En cada dato verás lo segura que está la IA y un enlace a la fuente. Revisas la ficha antes de compartirla. Las alergias y la medicación siempre las confirmas tú. Probaremos el prototipo con documentos revisados por un médico."],["¿Qué idiomas habrá?","Al principio, MedHarbor leerá documentos en ucraniano, inglés, alemán, francés y español, y creará fichas en esos mismos cinco idiomas. Añadiremos más según la demanda."],["¿Cómo se protegerán mis datos?","Se quedan en la UE y van cifrados. Solo los tratamos con tu consentimiento, nunca se usan para entrenar una IA y puedes borrarlo todo con un toque. Más detalles en Privacidad."],["¿Cómo se financia el proyecto?","Estamos solicitando subvenciones europeas y nacionales para innovación y salud digital. Financiadores y socios pueden escribir directamente al fundador."],["¿Cómo puedo ayudar?","Únete al piloto como paciente, médico u organización, escribe una carta de apoyo o ponnos en contacto con una clínica o una ONG."]],all:"Todas las preguntas"},

 pilot:{eye:"Únete al piloto",h:"Participa en el primer piloto",lead:"Déjanos tus datos y te escribiremos cuando el prototipo esté listo para probarlo. Es gratis y sin compromiso.",role:"Soy",roles:["Paciente o familiar","Médico u otro profesional sanitario","Una organización (clínica, aseguradora, ONG, empresa de movilidad)","Financiador o inversor","Otro"],name:"Nombre",email:"Correo electrónico",country:"País donde vives",langs:"Idiomas de tus documentos médicos",msg:"Mensaje (opcional)",consent:"Acepto que MedHarbor guarde estos datos para contactarme sobre el piloto, como se explica en el",consentLink:"aviso de privacidad",send:"Apuntarme al piloto",sent:"¡Gracias! Ya estás en la lista del piloto. Te escribiremos cuando empiecen las pruebas.",nextH:"Qué pasa después de apuntarte",next:["Te confirmamos la inscripción por correo.", "En cuanto tengamos la financiación, construimos el prototipo. Tarda unas 12 semanas.", "Te invitamos a probarlo y te pedimos tu opinión."],auto:"Gracias por apuntarte a la lista del piloto de MedHarbor. Te escribiremos cuando empiecen las pruebas. MedHarbor, medharborai.com",auto2:"Gracias por tu mensaje a MedHarbor. Te responderemos pronto por correo. MedHarbor, medharborai.com",sending:"Enviando…",openApp:"Abrir el correo",mailNote:"Tu aplicación de correo debería abrirse con el mensaje listo. Pulsa Enviar allí para terminar. Todavía no se ha enviado nada.",mailHint:"Al hacer clic se abre tu aplicación de correo con el mensaje ya escrito. Lo envías tú.",gmail:"Abrir en Gmail",copyText:"Copiar mensaje",noApp:"¿No se abrió ninguna aplicación de correo?",copied2:"Mensaje copiado. Pégalo en un correo nuevo para",fail:"No se ha podido enviar el mensaje. Inténtalo de nuevo o escríbenos a contact@medharborai.com.",btns:["Apuntarme al piloto", "Apuntarme al piloto", "Hablar de una colaboración", "Escribir al fundador", "Enviar mensaje"],sentMsg:"¡Gracias! Hemos recibido tu mensaje y te responderemos por correo.",consent2:"Acepto que MedHarbor guarde estos datos para responder a mi mensaje, como se explica en el",org:"Organización",err:"Corrige los campos marcados.",vName:"Escribe tu nombre: solo letras, al menos 2.",vEmail:"Escribe un correo válido, por ejemplo nombre@ejemplo.es.",vCountry:"Elige tu país.",vOrg:"Escribe el nombre de tu organización.",vMsg:"El mensaje puede tener hasta 1000 caracteres y no puede incluir < ni >.",vConsent:"Marca la casilla para dar tu consentimiento.",pickCountry:"Elige un país",langsHint:"Marca todas las que correspondan",other:"Otro",direct:"¿Tienes preguntas? Escribe al fundador",copy:"Copiar",copied:"Copiado",whyH:"Por qué participar",why:[["Pacientes y familias","Sé de los primeros en probar la ficha con tus propios documentos, gratis."],["Médicos","Ayuda a decidir qué muestra la ficha y cómo se ve."],["Organizaciones","Preparemos juntos un piloto para tus socios, empleados o clientes."],["Financiadores","Recibe los resultados del piloto y la descripción completa del proyecto."]]},
 legal:{privacy:{h:"Aviso de privacidad",u:"Última actualización: noviembre de 2026",s:[["Responsable",FOUNDER+", fundador del proyecto MedHarbor (medharborai.com). Contacto: contact@medharborai.com."],["Qué datos recoge esta web","Solo lo que nos envías a través del formulario del piloto o por correo: nombre, correo, país, rol, idiomas de tus documentos y tu mensaje. Esta web no recoge datos de salud. El formulario no envía nada desde esta web: abre tu aplicación de correo con un mensaje listo, y solo nos llega cuando pulsas Enviar."],["Para qué","Para contactarte sobre el piloto de MedHarbor y las novedades del proyecto. Base legal: tu consentimiento (artículo 6.1.a del RGPD)."],["Durante cuánto tiempo","Hasta que termine el piloto o hasta que nos pidas borrarlos, lo que ocurra antes."],["Tus derechos","Puedes pedir acceder a tus datos, corregirlos, borrarlos, limitar su uso o llevártelos, oponerte a su tratamiento y retirar tu consentimiento en cualquier momento. Escribe a contact@medharborai.com. También puedes reclamar ante la autoridad de protección de datos de tu país."],["La futura aplicación","La aplicación MedHarbor aún no existe. Antes de lanzarse tendrá su propia política de privacidad para los datos de salud."]]},imprint:{h:"Aviso legal",u:"",s:[["Responsable del contenido",FOUNDER+", fundador del proyecto MedHarbor"],["Contacto","contact@medharborai.com"],["Datos de la empresa","MedHarbor todavía no está registrado como empresa. Los datos se publicarán aquí cuando se registre."]]}},

 problem:{eye:"Проблема",h:"З кожним переїздом за кордон медична історія починається з нуля",lead:"Коли ви переїжджаєте в іншу країну, новий лікар не може скористатися вашими медичними документами. Через це аналізи доводиться здавати знову, про алергії забувають, а з ліками трапляються помилки.",items:[["Документи, які новий лікар не може прочитати","Виписки, аналізи й рецепти на папері чи в PDF, різними мовами й алфавітами. Часто написані від руки."],["Замало часу, щоб їх прочитати", "У лікаря лише кілька хвилин на пацієнта. Ніхто не встигне прочитати сорок сторінок чужою мовою. Тож важливе губиться."],["Ті самі ліки мають іншу назву","Назви, дозування й правила відпуску ліків у кожній країні свої. Перекласти етикетку замало."]]},

 how:{eye:"Як це працюватиме",h:"Від шухляди з паперами до однієї картки за кілька хвилин",steps:[["Завантажте документи","Фото, скани або PDF будь-якою мовою, навіть рукописні."],["ШІ їх прочитає","MedHarbor розпізнає кожен документ і знайде в ньому діагнози, ліки, алергії, результати аналізів і щеплення разом з їхніми міжнародними медичними кодами."],["Ви перевіряєте","Біля кожного факту видно, наскільки ШІ впевнений, і є посилання на сторінку оригіналу. Алергії та ліки ви завжди підтверджуєте самі."],["Покажіть лікарю","Картка створюється мовою вашого лікаря. Поділитися нею можна через QR-код, тимчасове посилання або PDF."]]},

 modules:{eye:"Що плануємо",h:"Один сервіс на весь шлях",items:[["Картка пацієнта","Усі ваші документи в одному підсумку в міжнародному форматі Patient Summary. Спочатку алергії та ліки, потім уся історія."],["Ліки в іншій країні","Введіть назву ліків зі своєї країни. Ви побачите, яка в них діюча речовина, як вони називаються там, де ви живете зараз, і чи потрібен рецепт."],["Допомога на прийомі","Підготуйте питання заздалегідь, отримайте переклад під час прийому і збережіть підсумок двома мовами."]]},
 why:{eye:"Чому саме зараз",h:"Технології вже готові, а Європа домовляється про спільні правила",items:[["ШІ вже читає справжні документи","Сучасний ШІ читає скани, рукописи й різні алфавіти, і це коштує кілька центів за документ."],["Європа обирає спільний формат","Європейський простір медичних даних (EHDS) використовує International Patient Summary як спільний формат. MedHarbor працюватиме в ньому з першого дня."],["Чого не покриє EHDS","Офіційна система поєднає лише цифрові дані всередині ЄС. Паперові документи й документи з країн поза ЄС залишаються поза нею. Саме для таких випадків і створюється MedHarbor."],["Чіткі правила для ШІ в медицині","GDPR і Європейський акт про ШІ встановлюють зрозумілі правила. Ми дотримуємося їх від першого дня."]]},
 road:{eye:"План",h:"Що дасть етап прототипу",lead:"Дванадцять тижнів до робочого прототипу, який перевірять справжні користувачі й лікарі. Результати покажуть, що робити далі.",phases:[["Зараз","Концепція і перевірка ідеї","Розмови з пацієнтами й лікарями, юридична перевірка, дизайн прототипу, пошук партнерів."],["Тижні 1–2","Дослідження і дизайн","15 інтерв'ю з пацієнтами й 5 з лікарями, 200 знеособлених тестових документів, перевірка на відповідність MDR і GDPR."],["Тижні 3–9","Створення прототипу","Завантаження документів, ШІ, який читає й упорядковує дані, екран перевірки, картка п'ятьма мовами."],["Тижні 10–11","Закрите тестування","30–50 користувачів і 5–10 лікарів тестують справжні картки."],["Тиждень 12","Результати","Звіт про результати, рішення про наступні кроки, заявка на подальше фінансування."]],
  kpiH:"Як ми оцінимо тестування",kcols:["Що вимірюємо","Мета"],kpis:[["Точність, перевірена лікарем","Щонайменше 90 % правильних даних, жодної помилки в алергіях і ліках"],["Користувачі, які заповнили картку до кінця","Щонайменше 60 %"],["Лікарі, яким картка допомогла","Щонайменше 7 з 10"],["Користувачі, готові платити за Plus","Щонайменше 20 %"],["Користувачі, активні через 30 днів","Щонайменше 30 %"],["Листи про наміри від організацій","Щонайменше 2"]],
  riskH:"Головні ризики і що ми робимо",rcols:["Ризик","Що робимо"],risks:[["ШІ помиляється у важливих даних","Пацієнт перевіряє кожен факт, кожен факт має посилання на оригінал, а алергії й ліки тестуємо без права на помилку"],["MedHarbor визнають медичним виробом","Чітко обмежене призначення: упорядковувати й перекладати, ніколи не ставити діагнозів. Юридична перевірка до тестування"],["Витік медичних даних","Дані зберігаються в ЄС, шифрування, мінімальний доступ, без навчання ШІ на даних користувачів, перевірка безпеки перед запуском"],["Лікарі не довіряють картці","Знайомий лікарям формат, посилання на оригінали, лікарі залучені з першого тижня"],["Біженці не можуть платити","Безкоштовний доступ за кошти НГО і грантів; дохід від експатів і організацій"]],more:"Увесь план"},
 impact:{eye:"Користь",h:"Кому це допоможе і чому це важливо для Європи",lead:"MedHarbor допомагає людям, чия медична історія розкидана між кількома країнами, і лікарям, які їх лікують.",whoH:"Для кого",who:[["Біженці та переміщені особи","Часто приїжджають з паперовими документами іншою мовою і потребують водночас і невідкладної допомоги, і тривалого лікування."],["Експати й сім'ї, що переїжджають","Кожен переїзд означає нову систему охорони здоров'я. Роботодавці й страховики вже платять, щоб полегшити цей етап."],["Люди з хронічними хворобами","У людей з діабетом, хворобами серця чи раком найбільше документів, і їм найбільше шкодить, коли чогось бракує."],["Родини, що піклуються про рідних на відстані","Дорослі діти, які з однієї країни організовують лікування батьків в іншій."],["Лікарі та клініки","Отримують зрозумілу історію ще до прийому, а не стос неперекладених сторінок."],["Страховики й державні служби","Менше повторних аналізів і менше помилок з ліками, яких можна було уникнути."]],alignH:"Як це відповідає пріоритетам ЄС",align:[["Європейський простір медичних даних","Картки використовують International Patient Summary і HL7 FHIR, тобто формати, обрані для EHDS."],["Рівний доступ до лікування","Підтримує Цілі сталого розвитку ООН 3 (здоров'я) і 10 (менше нерівності), бо прибирає мовний бар'єр."],["ШІ, якому можна довіряти","Кожен результат можна перевірити, і його підтверджує людина, як того вимагає Європейський акт про ШІ."],["Дані залишаються в Європі","Зберігання в ЄС, GDPR від самого початку, і лише користувач вирішує, хто бачить картку."]],outH:"Що ми хочемо змінити",out:[["Менше повторних аналізів","Лікар бачить попередні результати й не призначає їх знову."],["Безпечніші призначення","Алергії та поточні ліки на першій сторінці, мовою лікаря."],["Коротші прийоми","Лікар має підсумок ще до прийому і не мусить усе розпитувати заново."]]},
 model:{eye:"Бізнес-модель",h:"Безкоштовно для тих, кому це найпотрібніше",lead:"Це поки що план. Ми перевіримо його під час тестування, і ціни ще можуть змінитися.",streams:[["Безкоштовно для людей","Основне: до 15 документів, одна картка, одна мова лікаря."],["Підписка Plus","Близько 6–9 € на місяць: без обмеження документів, усі мови, ліки в іншій країні, допомога на прийомі."],["Організації","Ліцензії для міжнародних медичних страховиків, компаній з релокації та клінік з іноземними пацієнтами."],["Доступ за кошти партнерів","НГО та державні програми оплачують, щоб біженці користувалися MedHarbor безкоштовно."]],neverH:"Чого ми ніколи не робитимемо",never:["Продавати чи передавати медичні дані","Показувати рекламу чи рекламувати ліки","Брати комісію від аптек чи виробників ліків"],econ:"Обробка одного документа за допомогою ШІ коштує кілька центів. Основні витрати йдуть на пошук користувачів і контроль якості."},
 security:{eye:"Захист даних",h:"Як ми захищатимемо ваші дані",lead:"За GDPR медичні дані потребують найвищого рівня захисту. Нижче наші зобов'язання щодо продукту, який ми створюємо. Самого продукту ще немає.",items:[["Дані зберігаються в ЄС","Документи, отримані з них дані й картки зберігатимуться й оброблятимуться лише в дата-центрах ЄС."],["Завжди зашифровані","Дані шифруватимуться і під час зберігання, і під час передавання."],["Ваша явна згода","Медичні дані ми оброблятимемо лише з вашої явної згоди, і ви зможете відкликати її будь-коли."],["Без навчання ШІ на ваших даних","За договором наші постачальники ШІ не матимуть права навчати свої моделі на ваших документах."],["Мінімальний доступ","Доступ матимуть лише ті, кому він справді потрібен, і кожен доступ фіксуватиметься. Де можливо, імена прибиратимуться ще до обробки ШІ."],["Видалити все одним натиском","Якщо ви видалите акаунт, зникнуть усі документи, дані й картки."],["Ви керуєте доступом","Кожна картка, якою ви поділилися, діятиме стільки, скільки ви вирішите, і доступ можна закрити будь-коли."],["Незалежні перевірки","Оцінка впливу на захист даних і незалежна перевірка безпеки перед будь-яким публічним запуском."]],regH:"Правові рамки",regCols:["Документ","Що це означає для MedHarbor"],reg:[["EU MDR (медичні вироби)","MedHarbor упорядковує, перекладає й передає документи. Він не ставить діагнозів, не тлумачить результатів аналізів і не дає порад щодо лікування. Перед тестуванням буде офіційна юридична перевірка."],["GDPR, стаття 9","Явна згода, оцінка впливу, лише необхідні дані, зберігання в ЄС."],["Європейський акт про ШІ","Вміст, створений ШІ, чітко позначається, а версії моделей фіксуються."],["EHDS і HL7 FHIR","Картки мають формат International Patient Summary, щоб згодом працювати з іншими медичними системами."]],note:"MedHarbor не буде медичним виробом і не даватиме медичних порад."},
 concept:{eye:"Концепція",h:"Усе, що потрібно пацієнту, коли лікування перетинає кордон",lead:"Три функції навколо однієї картки пацієнта. Прототип починається з самої картки.",tag:"Планується",tabs:["Картка пацієнта","Ліки в іншій країні","Допомога на прийомі"],
  card:{h:"Картка пацієнта",p:"Усі ваші документи в одному місці й у зрозумілому порядку. Лікар спершу бачить головне: алергії, ліки, які ви приймаєте, хронічні хвороби. Далі вся історія.",li:["Завантаження фото, сканів і PDF будь-якою мовою","Тип документа визначається автоматично: виписка, аналізи, рецепт, щеплення","З документів беруться діагнози, ліки, алергії, результати аналізів і операції","Міжнародні коди: МКХ-10, ATC, LOINC","Кожен факт має посилання на свою сторінку в оригіналі","Поділитися можна в PDF, через QR-код або тимчасове посилання"]},
  meds:{h:"Ліки в іншій країні",p:"Ті самі ліки в іншій країні можуть мати іншу назву, дозування чи правила відпуску. MedHarbor покаже, яка діюча речовина у ваших ліках і як вони називаються там, де ви живете зараз.",li:["Пошук за назвою, діючою речовиною чи кодом ATC","Ліки, зареєстровані у вашій теперішній країні","За рецептом чи без","Інше дозування чи форма чітко позначені","Інформація для розмови з лікарем або фармацевтом, а не порада"],from:"Старий рецепт",ing:"Діюча речовина",to:"Продається в новій країні",rx:"За рецептом"},
  visit:{h:"Допомога на прийомі",p:"Прийом у лікаря короткий і напружений, коли погано знаєш мову. Ця функція допоможе підготуватися, перекладатиме під час розмови й збереже головне.",li:["Скарги й питання підготовлені й перекладені заздалегідь","Переклад в обидва боки з медичною лексикою й текстом на екрані","Підсумок прийому двома мовами","Підсумок додається у вашу картку","Звук обробляється наживо й за замовчуванням не зберігається"]}},
 funders:{eye:"Для фондів і партнерів",h:"Допоможіть нам створити MedHarbor",lead:"MedHarbor є проєктом на ранньому етапі, який веде його засновник. Ми шукаємо гранти й партнерів, щоб створити й протестувати прототип.",snapH:"Коротко про проєкт",snap:[["Проєкт","MedHarbor, медичний паспорт на основі ШІ"],["Сайт","medharborai.com"],["Етап","Ранній: концепція і дизайн прототипу"],["Засновник",FOUNDER],["На що піде фінансування","Розробка, дизайн, юридична перевірка, медична перевірка, тестування"],["Терміни","12 тижнів від фінансування до результатів тестування"],["Контакт","contact@medharborai.com"]],brief:"Опис проєкту (PDF, англійською)",helpH:"Як можна допомогти",help:[["Гранти й фінансування на старті","Профінансувати прототип і перше тестування."],["Партнери для тестування","Клініки, страховики, компанії з релокації та НГО, які можуть залучити користувачів і лікарів."],["Радники","Лікарі, фахівці з медичного права й захисту даних, інженери ШІ."],["Листи підтримки","Короткий лист про наміри робить наші грантові заявки сильнішими."]],cta:"Написати засновнику"},
 about:{eye:"Про проєкт",h:"Лікування не повинно зупинятися на кордоні",lead:"MedHarbor почався з простого спостереження: мільйони людей у Європі зберігають свою медичну історію в папці з паперами, яку не може прочитати жоден місцевий лікар. Ми створюємо ШІ-продукт, щоб це змінити.",founderH:"Засновник",role:"Засновник і CEO",short:"Засновник і CEO. Раніше працював над ШІ та інтероперабельністю в SoftServe, Grammarly і Doctolib. Живе у Львові.",bio:["Pavlo Bulelik, засновник і CEO MedHarbor, живе у Львові. Майже вісім років він працює на перетині ШІ та охорони здоров'я: був інженером із машинного навчання в SoftServe, де витягував дані зі сканованих клінічних документів для клієнтів із медичної галузі; працював у продукті для NLP і генеративного ШІ в Grammarly; а в Doctolib працював у продукті екосистеми та інтероперабельності, над транскордонним обміном медичними даними в Європі.", "Він заснував MedHarbor, щоб розв'язати проблему, яка зростає з кожним переїздом через кордон: медична історія людини залишається позаду, а наступний лікар має починати з нуля, часто мовою, якої не читає.", "Сьогодні MedHarbor на стадії pre-seed: концепція й дизайн картки пацієнта готові, домен і сторінку компанії налаштовано, а далі перший прототип на реальних медичних документах за підтримки грантів."],buildH:"Збираємо команду",buildLead:"Поки що MedHarbor веде засновник. Ми шукаємо радників і перших учасників команди для прототипу.",open:"Шукаємо",roles:[["Медичний радник","Практикуючий лікар, який перевірить картку й медичну лексику."],["Радник з права й захисту даних","Допомога з MDR, GDPR і Європейським актом про ШІ."],["Інженер ШІ та full-stack розробник","Створить прототип і ШІ, що читає документи."]],missionH:"Місія",mission:"Щоб медичну історію будь-якої людини міг зрозуміти будь-який лікар, будь-де, за кілька хвилин.",principlesH:"Наші принципи",principles:[["Перевірюваність понад усе","Підсумок без джерела гірший, ніж жодного. Кожен факт має посилання на оригінал."],["Упорядковувати, а не діагностувати","MedHarbor упорядковує й перекладає. Медичні рішення ухвалюють пацієнти й лікарі."],["Приватність закладена в продукт","Зберігання в ЄС, явна згода й видалення одним натиском є частиною продукту, а не дрібним шрифтом."],["Міжнародні стандарти","Ми використовуємо FHIR та International Patient Summary, щоб картки могли працювати із системами лікарів."]]},
 faq:{eye:"Питання",h:"Часті запитання",items:[["MedHarbor уже працює?","Ще ні. Ми на етапі концепції й дизайну прототипу і подаємося на гранти, щоб створити прототип і провести закрите тестування. Записатися на тестування можна вже зараз."],["Чи буде MedHarbor медичним виробом?","Ні. MedHarbor допомагатиме людям упорядковувати, перекладати й передавати власні медичні документи. Він не ставитиме діагнозів, не тлумачитиме аналізів і не радитиме лікування."],["Як ви подбаєте, щоб дані були правильні?","Біля кожного факту буде видно, наскільки ШІ впевнений, і посилання на джерело. Ви перевіряєте картку, перш ніж нею поділитися. Алергії та ліки завжди підтверджуєте ви. Прототип ми тестуватимемо на документах, які перевірив лікар."],["Які мови будуть?","На старті MedHarbor читатиме документи українською, англійською, німецькою, французькою та іспанською й створюватиме картки цими ж п'ятьма мовами. Інші мови додаватимемо залежно від попиту."],["Як захищатимуть мої дані?","Дані зберігаються в ЄС і шифруються. Ми обробляємо їх лише з вашої згоди, ніколи не навчаємо на них ШІ, а видалити все можна одним натиском. Детальніше на сторінці «Захист даних»."],["Як фінансується проєкт?","Ми подаємося на європейські й національні гранти на інновації та цифрову медицину. Фонди й партнери можуть написати засновнику напряму."],["Як я можу допомогти?","Долучіться до тестування як пацієнт, лікар чи організація, напишіть лист підтримки або познайомте нас із клінікою чи НГО."]],all:"Усі питання"},

function runDemo(btn){

}

 document.documentElement.lang=lang;
 const f=t().footer, cols=[['concept','how','impact','roadmap'],['pilot','funders','model','security'],['about','faq','privacy','imprint']];
 document.getElementById('footerGrid').innerHTML=`<div><div class="logo" style="margin-bottom:.75rem">MedHarbor</div><p class="disclaimer">${esc(f.blurb)}</p><p class="mono" style="margin-top:1rem">contact@medharborai.com</p><a class="social" href="${COMPANY_URL}" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.1 21 14.3V21h-4v-5.9c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.52-2.25 3.1V21H9z"/></svg>LinkedIn</a></div>`+cols.map((c,i)=>`<div><h5>${esc(f.cols[i])}</h5>${c.map(k=>`<a href="#${k}">${esc(label(k))}</a>`).join('')}</div>`).join('');
 document.getElementById('footerTag').textContent=f.tag;
}
const COUNTRIES='AD AE AF AG AI AL AM AO AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BR BS BT BW BY BZ CA CD CF CG CH CI CL CM CN CO CR CU CV CW CY CZ DE DJ DK DM DO DZ EC EE EG ER ES ET FI FJ FM FO FR GA GB GD GE GG GH GI GL GM GN GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MG MH MK ML MM MN MO MR MT MU MV MW MX MY MZ NA NE NG NI NL NO NP NR NZ OM PA PE PG PH PK PL PR PS PT PW PY QA RO RS RU RW SA SB SC SD SE SG SI SK SL SM SN SO SR SS ST SV SX SY SZ TD TG TH TJ TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WS XK YE ZA ZM ZW'.split(' ');
const DOC_LANGS=['uk','ru','en','de','fr','es','pl','it','ro','pt','tr','ar'];
function dn(type,code){try{const n=new Intl.DisplayNames([lang],{type}).of(code);return n&&n!==code?n.charAt(0).toUpperCase()+n.slice(1):code;}catch(x){return code;}}
function countryOptions(){return COUNTRIES.map(c=>[c,c==='XK'?(dn('region','XK')):dn('region',c)]).sort((a,b)=>a[1].localeCompare(b[1],lang)).map(([c,n])=>`<option value="${c}">${esc(n)}</option>`).join('');}
function langChips(){return DOC_LANGS.map(c=>`<button type="button" class="chip" data-dl="${c}" aria-pressed="false">${esc(dn('language',c))}</button>`).join('')+`<button type="button" class="chip" data-dl="other" aria-pressed="false">${esc(t().pilot.other)}</button>`;}
const RX={
 name:/^(?=.{2,80}$)[\p{L}\p{M}]+(?:[ '’.\-]{1,2}[\p{L}\p{M}]+)*\.?$/u,
 email:/^(?=.{6,254}$)(?!\.)(?!.*\.\.)[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]{1,64}(?<!\.)@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,24}$/,
 org:/^(?=.{2,120}$)[\p{L}\p{N}][\p{L}\p{M}\p{N} .,'’&()\/+\-]*$/u
};
function roleIdx(){const s=document.getElementById('f-role');return s?+s.value:0;}
function checkField(id){
 const c=t().pilot, el=document.getElementById('f-'+id), ri=roleIdx(); if(!el) return true;
 let v=(el.type==='checkbox')?el.checked:el.value.trim(), msg='';
 if(id==='name'&&!RX.name.test(v)) msg=c.vName;
 if(id==='email'&&!RX.email.test(v)) msg=c.vEmail;
 if(id==='org'&&(ri===2||ri===3)&&!RX.org.test(v)) msg=c.vOrg;
 if(id==='country'&&(ri===0||ri===1)&&!v) msg=c.vCountry;
 if(id==='msg'&&(v.length>1000||/[<>]/.test(v))) msg=c.vMsg;
 if(id==='consent'&&!v) msg=c.vConsent;
 const e=document.getElementById('e-'+id);
 if(e){e.textContent=msg;e.hidden=!msg;}
 el.setAttribute('aria-invalid',msg?'true':'false');
 if(msg&&e){el.setAttribute('aria-describedby','e-'+id);} else el.removeAttribute('aria-describedby');
 return !msg;
}
const FIELDS=['org','name','email','country','msg','consent'];
document.addEventListener('focusout',e=>{const id=(e.target.id||'').replace(/^f-/,''); if(FIELDS.includes(id)&&e.target.closest('#pform')&&(e.target.value||e.target.getAttribute('aria-invalid')==='true')) checkField(id);});
document.addEventListener('input',e=>{
 const el=e.target, id=(el.id||'').replace(/^f-/,''); if(!el.closest||!el.closest('#pform')) return;
 if(id==='name') {const v=el.value.replace(/[^\p{L}\p{M} '’.\-]/gu,''); if(v!==el.value) el.value=v;}
 if(id==='email'){const v=el.value.replace(/\s/g,''); if(v!==el.value) el.value=v;}
 if(id==='msg'){const v=el.value.replace(/[<>]/g,''); if(v!==el.value) el.value=v; const cc=document.getElementById('c-msg'); if(cc) cc.textContent=el.value.length+' / 1000';}
 if(FIELDS.includes(id)&&el.getAttribute('aria-invalid')==='true') checkField(id);
});
document.addEventListener('change',e=>{if(e.target.id==='f-country'||e.target.id==='f-consent') checkField(e.target.id.slice(2));});
let presetRole=0;
const PILOT_ROLES=[0,1];
function applyRole(){
 const sel=document.getElementById('f-role'); if(!sel) return;
 const i=+sel.value, c=t().pilot, isPilot=PILOT_ROLES.includes(i);
 document.getElementById('w-org').hidden=!(i===2||i===3);
 ['org','country'].forEach(id=>{const e=document.getElementById('e-'+id); if(e&&!e.hidden) checkField(id);});
 document.getElementById('w-langs').hidden=i!==0;
 document.getElementById('consentTxt').textContent=isPilot?c.consent:c.consent2;
 const btn=document.getElementById('f-send'); if(!btn.disabled) btn.textContent=c.btns[i];
}
document.addEventListener('change',e=>{if(e.target.id==='f-role'){presetRole=+e.target.value;applyRole();}});
function render(scroll){
 const r=currentRoute();
 document.getElementById('main').innerHTML=PAGES[r]();
 applyRole();
 renderChrome();
 document.getElementById('mobileMenu').classList.remove('open');
 document.title=r==='home'?'MedHarbor':`${label(r)} · MedHarbor`;try{const md=document.querySelector('meta[name="description"]');if(md){const d=t().hero.lead;md.setAttribute('content',d.length>160?d.slice(0,d.lastIndexOf(' ',157))+'…':d);}}catch(e){}
 if(scroll) window.scrollTo({top:0,behavior:'instant'});
}

/* ============ events ============ */
const onHash=()=>{const r=routeFrom(location.hash)||'home'; if(r!==ROUTE){ROUTE=r;running=false;shown=new Set(ORDER);render(true);}};
window.addEventListener('hashchange',onHash);
window.addEventListener('popstate',onHash);
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');
 if(b&&b.tagName==='A'){const href=b.getAttribute('href')||''; if(href.startsWith('#')){const r=routeFrom(href); if(r){e.preventDefault(); document.getElementById('langMenu').classList.remove('open'); if(b.dataset.role!==undefined) presetRole=+b.dataset.role; go(r); return;}}}
 if(!e.target.closest('.lang')) document.getElementById('langMenu').classList.remove('open');
 if(!b) return;
 if(b.dataset.lang){document.getElementById('langMenu').classList.remove('open');const lb=document.getElementById('langBtn');if(lb)lb.setAttribute('aria-expanded','false');lang=b.dataset.lang;try{localStorage.setItem('mh.lang',lang)}catch(x){} syncLangUrl(); running=false; shown=new Set(ORDER); render(false);return;}
 if(b.id==='langBtn'){const m=document.getElementById('langMenu');m.classList.toggle('open');b.setAttribute('aria-expanded',m.classList.contains('open'));return;}
 if(b.id==='burger'){document.getElementById('mobileMenu').classList.toggle('open');return;}
 if(b.id==='themeBtn'){const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('mh.theme',dark?'light':'dark')}catch(x){}return;}
 if(b.dataset.dl){const on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);return;}
 if(b.dataset.demo){demoLang=b.dataset.demo;updateDemo();return;}
 if(b.id==='runDemo'){runDemo(b);return;}
 if(b.dataset.ptab!==undefined){ptab=+b.dataset.ptab;render(false);return;}
 if(b.id==='copyBtn'){const txt=MAIL.founder;const done=()=>{b.textContent=t().pilot.copied;setTimeout(()=>b.textContent=t().pilot.copy,1800)};const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('mailTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);done();};try{navigator.clipboard.writeText(txt).then(done).catch(fb);}catch(x){fb();}return;}
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='pform') return;
 e.preventDefault();
 const f=e.target, q=s=>f.querySelector(s), name=q('#f-name').value.trim(), email=q('#f-email');
 const bad=FIELDS.filter(id=>!checkField(id)); const ok=!bad.length;
 if(!ok){const first=document.getElementById('f-'+bad[0]); if(first) first.focus();}
 const err=document.getElementById('ferr'), done=document.getElementById('ftoast'), fail=document.getElementById('ffail');
 err.hidden=ok; fail.hidden=true; done.hidden=true;
 if(!ok) return;
 if(q('#f-hp').value) return;
const c=t().pilot;
 const ri=+q('#f-role').value, role=q('#f-role').selectedOptions[0].text, isPilot=PILOT_ROLES.includes(ri), to=ROLE_MAIL[ri]||MAIL.hello;
 const org=(ri===2||ri===3)?q('#f-org').value.trim():'';
 const cty=q('#f-country').value?q('#f-country').selectedOptions[0].text+' ('+q('#f-country').value+')':'';
 const dl=ri===0?[...f.querySelectorAll('#f-langs .chip.on')].map(x=>x.textContent).join(', '):'';
 const msg=q('#f-msg').value.trim();
 const subject=(isPilot?'MedHarbor pilot: ':'MedHarbor contact: ')+role+' / '+name;
 const lines=['Name: '+name,'Email: '+email.value,'Role: '+role];
 if(org) lines.push('Organisation: '+org); if(cty) lines.push('Country: '+cty); if(dl) lines.push('Document languages: '+dl);
 lines.push('Site language: '+LC(lang),'Consent: yes (privacy notice, medharborai.com)');
 const body=lines.join('\n')+'\n\nMessage:\n'+(msg||'-')+'\n';
 const enc=encodeURIComponent;
 // very long bodies are cut for the mailto link (clients limit its length); the full text is copied to the clipboard
 let short=body; while(enc(short).length>1700&&short.length>200) short=short.slice(0,short.length-100);
 if(short!==body) short=short.trimEnd()+'\n[…]';
 const mailto='mailto:'+to+'?subject='+enc(subject)+'&body='+enc(short.replace(/\n/g,'\r\n'));
 const gmail='https://mail.google.com/mail/?view=cm&fs=1&to='+enc(to)+'&su='+enc(subject)+'&body='+enc(body.slice(0,3000));
 const full='To: '+to+'\nSubject: '+subject+'\n\n'+body;
 done.innerHTML='<p style="margin:0 0 .6rem">'+esc(c.mailNote)+'</p><p style="margin:0 0 .5rem;font-weight:600">'+esc(c.noApp)+'</p><div style="display:flex;gap:.5rem;flex-wrap:wrap"><a class="btn btn-primary" href="'+mailto.replace(/&/g,'&amp;')+'">'+esc(c.openApp)+'</a><a class="btn btn-ghost" href="'+gmail+'" target="_blank" rel="noopener">'+esc(c.gmail)+'</a><button type="button" class="btn btn-ghost" id="copyMsg">'+esc(c.copyText)+'</button></div><p id="copyNote" class="muted" style="margin:.6rem 0 0;font-size:.85rem" hidden></p>';
 done.hidden=false;
 const cm=document.getElementById('copyMsg');
 cm.onclick=()=>{const ok=()=>{const n=document.getElementById('copyNote'); n.textContent=c.copied2+' '+to; n.hidden=false;};try{navigator.clipboard.writeText(full).then(ok).catch(()=>{});}catch(x){}};
 // top-level page: open the mail app directly; inside a frame (previews) the buttons above do the job
 try{if(window.top===window) window.location.href=mailto;}catch(x){}
});
try{const th=localStorage.getItem('mh.theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(e){}
render(false);
</script>
</body>
