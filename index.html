/* Layout concept: a calm harbour. Light working pages, one deep-indigo hero where scattered documents dock into one card; coral marks what matters. */
:root{
  --bg:#f7f6fb; --bg-2:#ffffff; --ink:#15173a; --ink-2:#55597a; --line:#e2e1ee;
  --harbor:#14173d; --harbor-2:#1f2460; --on-harbor:#f4f2fb; --on-harbor-2:#c4c4e2;
  --tide:#d4472e; --tide-2:#b53a24; --tide-soft:#fde6e0; --eyebrow:#c0412a;
  --amber:#e9a23b; --amber-soft:#fcefd8; --good:#1c8f5a; --warn:#b5650f;
  --shadow:0 20px 60px rgba(20,23,61,.12);
  --display:"MH Display",Georgia,"Times New Roman",serif;
  --body:"MH Body","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"MH Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f26; --bg-2:#171a3a; --ink:#ecebf7; --ink-2:#b0b1d0; --line:#2a2d55;
  --harbor:#090a1c; --harbor-2:#171a45; --on-harbor:#f4f2fb; --on-harbor-2:#c4c4e2;
  --tide:#ff7a5c; --tide-2:#ff9a82; --tide-soft:#3d1c18; --eyebrow:#ff9a82;
  --amber:#f0b64f; --amber-soft:#3a2d12; --good:#3fbf83; --warn:#f0a548;
  --shadow:0 20px 60px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f26; --bg-2:#171a3a; --ink:#ecebf7; --ink-2:#b0b1d0; --line:#2a2d55;
  --harbor:#090a1c; --harbor-2:#171a45; --on-harbor:#f4f2fb; --on-harbor-2:#c4c4e2;
  --tide:#ff7a5c; --tide-2:#ff9a82; --tide-soft:#3d1c18; --eyebrow:#ff9a82;
  --amber:#f0b64f; --amber-soft:#3a2d12; --good:#3fbf83; --warn:#f0a548;
  --shadow:0 20px 60px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg-2)}
a{color:inherit}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5.4vw,4.3rem)}
h2{font-size:clamp(1.75rem,3.5vw,2.7rem)}
h3{font-size:1.3rem}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.narrow{max-width:800px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--eyebrow)}
.lead{font-size:1.15rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.35rem;border-radius:999px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--tide);color:#fff;border-color:var(--tide)}
.btn-primary:hover{background:var(--tide-2);border-color:var(--tide-2);box-shadow:0 10px 30px rgba(212,71,46,.3)}
.btn-ghost{background:var(--bg-2);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-light{background:var(--on-harbor);color:#14173d;border-color:var(--on-harbor)}
.btn-outline-light{background:transparent;color:var(--on-harbor);border-color:rgba(244,242,251,.4)}
.btn-outline-light:hover{border-color:var(--on-harbor)}
.btn:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--tide);outline-offset:3px}
.section{padding-block:clamp(3.5rem,8vw,6.5rem)}
.section.tight{padding-top:0}
.section:not(.band)+.section:not(.band){padding-top:0}
.section-head{display:grid;gap:1rem;max-width:780px;margin-bottom:clamp(2rem,5vw,3.25rem)}
.grid{display:grid;gap:1.25rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.g2{grid-template-columns:1fr}}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.g3{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr}}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;min-width:0}
.card h3{margin-bottom:.5rem}
.card p{color:var(--ink-2)}
.icon{width:44px;height:44px;border-radius:12px;background:var(--tide-soft);color:var(--tide);display:grid;place-items:center;margin-bottom:1rem;flex-shrink:0}
.icon svg{width:22px;height:22px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg-2) 84%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
header .wrap{max-width:1320px}
.nav{display:flex;align-items:center;gap:1.25rem;height:72px}
.logo{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-family:var(--display);font-weight:600;font-size:1.32rem;letter-spacing:-.015em;white-space:nowrap;flex-shrink:0;color:var(--ink)}
.logo svg{width:34px;height:34px;flex-shrink:0;display:block}
.links{display:flex;align-items:center;gap:.15rem;margin:0 auto;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.links a{text-decoration:none;padding:.5rem .95rem;border-radius:999px;font-weight:500;color:var(--ink-2);font-size:.92rem;white-space:nowrap;transition:color .15s,background .15s}
.links a:hover{color:var(--ink)}
.links a.active{color:var(--ink);background:var(--bg-2);box-shadow:0 1px 3px rgba(20,23,61,.12)}
.nav-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.lang{position:relative}
.ctrl{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:40px;min-width:40px;padding:0 .75rem;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink);white-space:nowrap}
.ctrl:hover{border-color:var(--ink-2)}
.ctrl svg{width:17px;height:17px;flex-shrink:0;display:block}
.icon-btn{padding:0;width:40px}
.lang-menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--bg-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:200px;padding:.4rem;display:none;z-index:70}
.lang-menu.open{display:block}
.lang-menu button{display:flex;width:100%;gap:.7rem;align-items:center;border:0;background:none;text-align:left;padding:.6rem .75rem;border-radius:9px;font:inherit;font-size:.95rem;cursor:pointer;color:var(--ink)}
.lang-menu button:hover,.lang-menu button.on{background:var(--bg)}
.lang-menu button.on::after{content:"";margin-left:auto;width:12px;height:7px;border-left:2px solid var(--tide);border-bottom:2px solid var(--tide);transform:rotate(-45deg) translateY(-2px)}
.lang-menu .code{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);width:2.2ch}
.cta-nav{height:40px;padding:0 1.15rem;font-size:.9rem}
.burger{display:none}
.mobile-menu{display:none;border-top:1px solid var(--line);padding:.4rem 0 .6rem}
.mobile-menu a{display:block;padding:.5rem .75rem;font-size:.95rem;text-decoration:none;font-weight:500;border-radius:10px}
.mobile-menu a:hover,.mobile-menu a.active{background:var(--bg)}
.mobile-menu.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 .75rem;max-height:calc(100vh - 80px);overflow-y:auto}
.mobile-menu .mm-cta{display:none}
@media (max-width:640px){.mobile-menu.open{grid-template-columns:1fr}.mobile-menu .mm-cta{display:inline-flex;margin-top:.5rem}}
@media (max-width:1360px){.links{display:none}.burger{display:inline-flex}.nav-right{margin-left:auto}}
@media (max-width:640px){.nav .cta-nav{display:none}.nav{height:64px;gap:.75rem}}
@media (max-width:420px){.nav{gap:.5rem}.nav-right{gap:.35rem}.nav-right .ctrl{padding:0 .6rem;min-width:38px;height:38px}.lang #langBtn svg{display:none}.logo{font-size:1.15rem}}

/* hero */
.hero{background:radial-gradient(1200px 600px at 70% -10%,var(--harbor-2),var(--harbor) 60%);color:var(--on-harbor);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:3rem;align-items:center;padding-block:clamp(3rem,7vw,5.5rem)}
.stage{display:inline-flex;align-items:center;gap:.55rem;padding:.4rem .85rem;border-radius:999px;background:rgba(255,122,92,.14);border:1px solid rgba(255,122,92,.35);color:#ffc3b3;font-size:.82rem;font-weight:600;letter-spacing:.02em}
.stage i{width:8px;height:8px;border-radius:50%;background:#ff7a5c;box-shadow:0 0 0 4px rgba(255,122,92,.2);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.hero h1{margin:1.25rem 0 1.25rem;font-size:clamp(2.1rem,4.1vw,3.4rem);line-height:1.12}
.hero h1 em{display:block;font-style:italic;color:#ffb8a4;font-weight:400}
.hero .lead{color:var(--on-harbor-2);font-size:1.18rem}
.hero-cta{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
.hero-note{margin-top:1.25rem;font-size:.86rem;color:var(--on-harbor-2);display:flex;gap:1.25rem;flex-wrap:wrap}
.hero-note span{display:inline-flex;align-items:center;gap:.4rem}
.hero-note svg{width:16px;height:16px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.harbor{position:relative;aspect-ratio:1/1;max-width:500px;width:100%;margin:0 auto;min-width:0}
.doc{position:absolute;width:118px;padding:10px 12px;border-radius:10px;background:#fff;color:#15173a;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:.68rem;line-height:1.25;transform:rotate(var(--rot));animation:drift 7s ease-in-out infinite alternate;animation-delay:var(--d)}
.doc .tag{display:inline-block;font-family:var(--mono);font-size:.6rem;padding:1px 6px;border-radius:4px;background:#f1f0f8;color:#55597a;margin-bottom:6px}
.doc .ln{height:5px;border-radius:3px;background:#e4e2f0;margin:4px 0}
.doc .ln.s{width:60%}.doc .ln.m{width:80%}
.doc .h{font-weight:700;font-size:.7rem;margin-bottom:2px}
@keyframes drift{from{transform:rotate(var(--rot)) translateY(0)}to{transform:rotate(calc(var(--rot) * -.6)) translateY(-10px)}}
.lane{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.lane path{fill:none;stroke:rgba(255,122,92,.4);stroke-width:1.5;stroke-dasharray:6 8;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pcard{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(300px,80%);background:#fff;color:#15173a;border-radius:16px;padding:16px 18px;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid rgba(255,122,92,.5)}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:10px}
.pcard .top b{font-family:var(--display);font-size:1.05rem}
.pcard .pill{background:#fde6e0;color:#b53a24}
.pcard .row{display:flex;justify-content:space-between;gap:.75rem;font-size:.8rem;padding:6px 0;border-top:1px dashed #e2e1ee}
.pcard .row span:first-child{color:#55597a}
.pcard .row.alert span:last-child{color:#b5650f;font-weight:600}
.pcard .foot{margin-top:8px;font-family:var(--mono);font-size:.62rem;color:#55597a;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:600px){.doc.lo{display:none}.doc{width:104px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pill{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:3px 9px;border-radius:999px;background:var(--tide-soft);color:var(--tide-2);white-space:nowrap}

/* snapshot */
.snap{background:var(--bg-2);border-bottom:1px solid var(--line)}
.snap .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);padding-left:0;padding-right:0}
.snap .cell{background:var(--bg-2);padding:1.1rem 1.4rem;min-width:0}
.snap .k{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.snap .v{font-weight:600;font-size:1rem;margin-top:.15rem;font-variant-numeric:tabular-nums}
@media (max-width:860px){.snap .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.snap .wrap{grid-template-columns:1fr}}

/* bands */
.band{background:var(--harbor);color:var(--on-harbor)}
.band .lead,.band p{color:var(--on-harbor-2)}
.band .card{background:var(--harbor-2);border-color:rgba(255,255,255,.08)}
.band .card h3{color:var(--on-harbor)}
.band .card p{color:var(--on-harbor-2)}
.band .icon{background:rgba(255,122,92,.15);color:#ffb8a4}
.band .eyebrow{color:#ffb8a4}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.stats{grid-template-columns:1fr}}
.stat{display:grid;gap:.4rem;align-content:start;border-top:2px solid rgba(255,122,92,.5);padding-top:1.1rem}
.stat b{font-family:var(--display);font-size:clamp(2.2rem,4vw,3rem);line-height:1;font-weight:500;font-variant-numeric:tabular-nums;color:var(--on-harbor)}
.stat span{color:var(--on-harbor-2);font-size:.95rem}
.stat a{font-family:var(--mono);font-size:.72rem;color:#ffb8a4;text-decoration:none;letter-spacing:.02em}
.stat a:hover{text-decoration:underline}

/* steps */
.steps{counter-reset:s}
.step{position:relative;padding-top:3.4rem;min-width:0}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:0;font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--tide)}
.band .step::before{color:#ffb8a4}
.step h3{margin-bottom:.4rem}

/* demo */
.demo{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start}
@media (max-width:900px){.demo{grid-template-columns:1fr}}
.demo-bar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:.42rem .85rem;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--harbor);color:var(--on-harbor);border-color:var(--harbor)}
.paper{background:#fffdf8;color:#2a2a35;border:1px solid var(--line);border-radius:6px;padding:1.6rem 1.5rem;font-family:"Times New Roman",Georgia,serif;font-size:.98rem;line-height:1.75;box-shadow:var(--shadow);position:relative;min-width:0;transform:rotate(-.6deg)}
.paper .stamp{position:absolute;right:16px;top:14px;border:2px solid #9a3b3b;color:#9a3b3b;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;font-size:.55rem;font-family:var(--mono);text-align:center;line-height:1.1;transform:rotate(14deg);opacity:.55}
.paper h5{margin:0 0 .75rem;font-size:.95rem;letter-spacing:.06em;text-align:center;font-weight:700;padding-right:60px}
.paper p{margin:.25rem 0}
.paper mark{background:transparent;color:inherit;border-radius:3px;padding:0 2px;transition:background .35s,box-shadow .35s}
.paper mark.on{background:#ffe0d6;box-shadow:inset 0 -2px 0 #e5573d}
.paper mark.now{background:#ffc9b8}
.paper-cap{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);margin-bottom:.6rem;letter-spacing:.04em}
.sheet{background:var(--bg-2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.sheet-head{background:var(--harbor);color:var(--on-harbor);padding:1rem 1.4rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.sheet-head b{font-family:var(--display);font-size:1.15rem;font-weight:500}
.sheet-head .pill{background:rgba(255,255,255,.12);color:var(--on-harbor)}
.sheet-head .pill.ok{background:rgba(63,191,131,.2);color:#9be7c2}
.sheet-body{padding:1.1rem 1.4rem 1.4rem;display:grid;gap:.9rem}
.sheet h4{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.3rem;font-weight:700}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem}
.sheet td{padding:.45rem 0;border-top:1px solid var(--line);vertical-align:top}
.sheet td:first-child{color:var(--ink-2);width:42%}
.sheet td.v{color:var(--ink);width:auto}
.sheet td.src{font-family:var(--mono);font-size:.7rem;color:var(--tide-2);white-space:nowrap;text-align:right;width:1%;padding-left:.75rem}
.sheet tr.alert td.v{color:var(--warn);font-weight:600}
.sheet tr.fresh td{animation:pop .5s ease}

const TRANSCRIPT={"en": ["You move to a new country. Your medical history stays behind, scattered across discharge letters, lab results and prescriptions, each in a different language.", "Your new doctor has a short appointment and a pile of papers they can't read. Tests get repeated. Important details get lost.", "MedHarbor is an AI medical passport we are building to fix this. You take photos of your documents, in any language.", "The AI picks out diagnoses, medication, allergies and test results, and puts them on one clear card. Every fact links back to the original page, and you confirm allergies and medication yourself.", "Your doctor reads the card in their own language. Each medicine shows its active ingredient and local equivalents. And during the visit, translation helps you understand each other.", "You decide who sees the card: with a QR code, a link that expires, or a PDF. MedHarbor organises and translates. It never diagnoses.", "MedHarbor is in development. We are looking for pilot users, clinics and partners. Visit medharborai.com."], "de": ["Sie ziehen in ein neues Land. Ihre Krankengeschichte bleibt zurück, verstreut auf Arztbriefe, Laborbefunde und Rezepte, jedes in einer anderen Sprache.", "Ihre neue Ärztin hat wenig Zeit und einen Stapel Papiere, die sie nicht lesen kann. Untersuchungen werden wiederholt. Wichtige Details gehen verloren.", "MedHarbor ist ein KI-Gesundheitspass, den wir genau dafür entwickeln. Sie fotografieren Ihre Unterlagen, egal in welcher Sprache.", "Die KI erkennt Diagnosen, Medikamente, Allergien und Laborwerte und fasst sie auf einer übersichtlichen Karte zusammen. Jeder Eintrag verweist auf die Originalseite, und Allergien und Medikamente bestätigen Sie selbst.", "Ihre Ärztin liest die Karte in ihrer eigenen Sprache. Bei jedem Medikament stehen der Wirkstoff und Präparate, die es hier gibt. Und im Gespräch hilft die Übersetzung, damit Sie sich verstehen.", "Sie entscheiden, wer die Karte sieht: per QR-Code, mit zeitlich begrenztem Link oder als PDF. MedHarbor ordnet und übersetzt. Diagnosen stellt es nie.", "MedHarbor ist in Entwicklung. Wir suchen Pilotnutzer, Kliniken und Partner. Mehr auf medharborai.com."], "fr": ["Vous partez vivre dans un nouveau pays. Votre dossier médical, lui, reste en morceaux : comptes rendus d'hospitalisation, analyses, ordonnances, chacun dans une autre langue.", "Votre nouveau médecin dispose de peu de temps et d'une pile de documents qu'il ne peut pas lire. On refait des examens. Des informations importantes se perdent.", "MedHarbor est un passeport médical basé sur l'IA, que nous développons pour changer cela. Vous photographiez vos documents, quelle que soit leur langue.", "L'IA repère les diagnostics, les traitements, les allergies et les résultats d'analyses, et les réunit sur une seule fiche claire. Chaque information renvoie à la page d'origine, et c'est vous qui confirmez allergies et traitements.", "Votre médecin lit la fiche dans sa propre langue. Pour chaque médicament, il voit la substance active et les équivalents disponibles sur place. Et pendant la consultation, la traduction vous aide à vous comprendre.", "C'est vous qui décidez qui voit la fiche : par QR code, par lien temporaire ou en PDF. MedHarbor organise et traduit. Il ne pose jamais de diagnostic.", "MedHarbor est en cours de développement. Nous recherchons des utilisateurs pilotes, des cliniques et des partenaires. Rendez-vous sur medharborai.com."], "es": ["Te mudas a otro país. Tu historial médico se queda atrás, repartido entre informes de alta, análisis y recetas, cada uno en un idioma distinto.", "Tu nuevo médico tiene una consulta corta y un montón de papeles que no puede leer. Se repiten pruebas. Se pierden datos importantes.", "MedHarbor es un pasaporte médico con IA que estamos creando para resolverlo. Haces fotos de tus documentos, estén en el idioma que estén.", "La IA identifica diagnósticos, medicación, alergias y resultados de análisis, y los reúne en una sola ficha clara. Cada dato enlaza con la página original, y las alergias y la medicación las confirmas tú.", "Tu médico lee la ficha en su propio idioma. En cada medicamento aparecen el principio activo y sus equivalentes en el país. Y durante la consulta, la traducción os ayuda a entenderos.", "Tú decides quién ve la ficha: con un código QR, un enlace que caduca o un PDF. MedHarbor ordena y traduce. Nunca diagnostica.", "MedHarbor está en desarrollo. Buscamos usuarios piloto, clínicas y socios. Más información en medharborai.com."], "uk": ["Ви переїжджаєте в іншу країну. А ваша медична історія лишається розкиданою: виписки, аналізи, рецепти, і кожен документ іншою мовою.", "Новий лікар має короткий прийом і стос паперів, які не може прочитати. Аналізи здають повторно. Важливі деталі губляться.", "Ми створюємо MedHarbor, медичний паспорт на основі ШІ, щоб це змінити. Ви фотографуєте свої документи, хоч якою мовою вони написані.", "ШІ знаходить діагнози, ліки, алергії та результати аналізів і зводить їх в одну зрозумілу картку. Кожен факт має посилання на сторінку оригіналу, а алергії й ліки ви підтверджуєте самі.", "Лікар читає картку своєю мовою. Для кожного препарату видно діючу речовину та місцеві аналоги. А під час прийому переклад допомагає вам зрозуміти одне одного.", "Ви вирішуєте, хто бачить картку: через QR-код, тимчасове посилання чи PDF. MedHarbor упорядковує і перекладає. Діагнозів він не ставить ніколи.", "MedHarbor зараз у розробці. Ми шукаємо учасників пілоту, клініки та партнерів. Деталі на medharborai.com."]};

 why:{eye:"Why now",h:"The technology is ready, and Europe is agreeing on common rules",items:[["AI can now read real documents","Today's AI can read scans, handwriting and different alphabets for a few cents per document."],["Europe is agreeing on one format","The European Health Data Space (EHDS) uses the International Patient Summary as its common format. MedHarbor will use the same format from the start."],["What EHDS won't cover","The official system will only connect digital records inside the EU. Paper records and documents from outside the EU are left out. MedHarbor is built for exactly these cases."],["Clear rules for AI in healthcare","GDPR and the EU AI Act set clear rules. We follow them from day one."]]},

  riskH:"Main risks and how we handle them",rcols:["Risk","What we do"],risks:[["The AI gets important data wrong","The patient checks every fact, each fact links to the original, and allergies and medication are tested with zero tolerance for errors"],["MedHarbor is classed as a medical device","A clearly limited purpose: organise and translate, never diagnose. A legal review before the pilot"],["Health data leaks","Data stays in the EU, encryption, minimal access, no AI training on user data, a security test before launch"],["Doctors don't trust the card","A format doctors know, links to the originals, doctors involved from week 1"],["Refugees can't pay","Free access funded by NGOs and grants; income from expats and organisations"]],more:"See the full roadmap"},
 impact:{eye:"Impact",h:"Who it helps, and why it matters for Europe",lead:"MedHarbor helps people whose medical history is spread across several countries, and the doctors who treat them.",whoH:"Who it's for",who:[["Refugees and displaced people","They often arrive with paper records in another language and need both urgent and long-term care."],["Expats and families who relocate","Every move means a new health system. Employers and insurers already pay to make this easier."],["People with chronic illnesses","People with diabetes, heart disease or cancer have the most documents and suffer most when something is missing."],["Families caring from abroad","Adult children in one country who organise their parents' care in another."],["Doctors and clinics","They get a clear history before the visit, not a pile of untranslated pages."],["Insurers and public services","Fewer repeated tests and fewer avoidable medication errors."]],alignH:"How it fits EU priorities",align:[["European Health Data Space","Cards use the International Patient Summary and HL7 FHIR, the formats chosen for EHDS."],["Equal access to care","Supports UN Sustainable Development Goals 3 (health) and 10 (less inequality) by removing language barriers in care."],["Trustworthy AI","Every result can be checked and is confirmed by a person, in line with the EU AI Act."],["Data stays in Europe","EU hosting, GDPR from the start, and the user decides who sees the card."]],outH:"What we want to change",out:[["Fewer repeated tests","Doctors see earlier results instead of ordering them again."],["Safer prescribing","Allergies and current medication are on the first page, in the doctor's language."],["Shorter appointments","The doctor has a summary before the visit and doesn't need to ask everything again."]]},
 model:{eye:"Business model",h:"Free for those who need it most",lead:"This model is a plan. We will test it in the pilot, and prices may still change.",streams:[["Free for individuals","The basics: up to 15 documents, one card, one doctor's language."],["Plus subscription","About €6–9 a month: unlimited documents, all languages, medicines abroad, appointment helper."],["Organisations","Licences for international health insurers, relocation companies and clinics with patients from abroad."],["Sponsored access","NGOs and public programmes pay so that refugees can use MedHarbor for free."]],neverH:"What we will never do",never:["Sell or share health data","Show ads or promote medicines","Take commission from pharmacies or drug makers"],econ:"Processing one document with AI costs a few cents. The real costs are reaching users and checking quality."},
 security:{eye:"Privacy & safety",h:"How we will protect your data",lead:"Under GDPR, health data needs the highest level of protection. These are our commitments for the product we are building. It doesn't exist yet.",items:[["Data stays in the EU","Documents, extracted data and cards will be stored and processed only in EU data centres."],["Always encrypted","Data will be encrypted both when stored and when sent."],["Your clear consent","We will only process health data with your explicit consent, and you can withdraw it at any time."],["No AI training on your data","Our AI providers will be barred by contract from training on your records."],["Minimal access","Only people who need access will get it, and every access is logged. Where possible, names are removed before AI processing."],["Delete everything in one tap","Deleting your account will remove all your documents, data and cards."],["You control sharing","Each shared card expires when you decide, and you can revoke access at any time."],["Independent checks","A data protection impact assessment and an independent security test before any public launch."]],regH:"Legal framework",regCols:["Rule","What it means for MedHarbor"],reg:[["EU MDR (medical devices)","MedHarbor only organises, translates and shares records. It does not diagnose, interpret results or give treatment advice. A formal review will take place before the pilot."],["GDPR, Article 9","Explicit consent, impact assessment, only the data we need, EU hosting."],["EU AI Act","AI-generated content is clearly labelled, and model versions are logged."],["EHDS and HL7 FHIR","Cards use the International Patient Summary format so they can work with other health systems later."]],note:"MedHarbor will not be a medical device and will not give medical advice."},

 funders:{eye:"For funders & partners",h:"Help us build MedHarbor",lead:"MedHarbor is an early-stage project led by its founder. We are looking for grants and partners to build and test the prototype.",snapH:"Project at a glance",snap:[["Project","MedHarbor, an AI medical passport"],["Website","medharborai.com"],["Stage","Early stage: concept and prototype design"],["Founder",FOUNDER],["Funding will cover","Development, design, legal review, medical review, pilot"],["Timeline","12 weeks from funding to pilot results"],["Contact","partnerships@medharborai.com"]],brief:"Project brief (PDF)",helpH:"How you can help",help:[["Grants and early funding","Fund the prototype and the first pilot."],["Pilot partners","Clinics, insurers, relocation companies and NGOs that can bring users and doctors to the pilot."],["Advisors","Doctors, experts in health law and data protection, AI engineers."],["Letters of support","A short letter of intent makes our grant applications stronger."]],cta:"Contact the founder"},
 about:{eye:"About",h:"Care shouldn't stop at a border",lead:"MedHarbor started with a simple observation: millions of people in Europe keep their medical history in a folder of papers that no local doctor can read. We are building an AI product to fix that.",founderH:"Founder",role:"Founder and CEO",short:"Founder and CEO. Previously worked on AI and interoperability at SoftServe, Grammarly and Doctolib. Based in Lviv, Ukraine.",bio:["Pavlo Bulelik is the founder and CEO of MedHarbor, based in Lviv, Ukraine. Over nearly eight years he has worked where AI meets healthcare: as a machine learning engineer at SoftServe, extracting data from scanned clinical documents for healthcare clients; in product for NLP and generative AI at Grammarly; and in product for ecosystem and interoperability at Doctolib, on cross-border medical data exchange in Europe.", "He founded MedHarbor to solve a problem that grows with every move across a border: a person's medical history stays behind, and the next doctor has to start from zero, often in a language they cannot read.", "Today MedHarbor is at the pre-seed stage: the concept and the patient card design are ready, the domain and company page are set up, and the next step is a first prototype built on real medical documents, supported by grant funding."],buildH:"Building the team",buildLead:"Right now MedHarbor is run by its founder. We are looking for advisors and the first team members for the prototype.",open:"Open role",roles:[["Medical advisor","A practising doctor to review the card and the medical vocabulary."],["Legal and data protection advisor","Help with MDR, GDPR and the EU AI Act."],["AI and full-stack engineer","Builds the prototype and the AI that reads documents."]],missionH:"Mission",mission:"Make anyone's medical history clear to any doctor, anywhere, in minutes.",principlesH:"Our principles",principles:[["Checkable, not just convincing","A summary without a source is worse than no summary. Every fact links to the original."],["Organise, never diagnose","MedHarbor sorts and translates. Medical decisions are made by patients and doctors."],["Privacy built in","EU hosting, explicit consent and one-tap deletion are part of the product, not the small print."],["International standards","We use FHIR and the International Patient Summary so the cards can work with doctors' systems."]]},
 faq:{eye:"Questions",h:"Frequently asked questions",items:[["Does MedHarbor exist yet?","Not yet. We are at the concept and prototype design stage, and we are applying for grants to build the prototype and run a closed pilot. You can join the pilot list today."],["Will MedHarbor be a medical device?","No. It will help people organise, translate and share their own medical documents. It will not diagnose, interpret results or recommend treatment."],["How will you make sure the data is correct?","Each fact will show how sure the AI is and link to its source. You check the card before you share it. Allergies and medication always need your confirmation. We will test the prototype on documents checked by a doctor."],["Which languages are planned?","At launch, MedHarbor will read documents in Ukrainian, English, German, French and Spanish and create cards in the same five languages. More will follow, depending on demand."],["How will my data be protected?","Your data stays in the EU and is encrypted. We only process it with your consent, it is never used to train AI, and you can delete everything in one tap. See Privacy & safety for details."],["How is the project funded?","We are applying for European and national grants for innovation and digital health. Funders and partners can contact the founder directly."],["How can I help?","Join the pilot as a patient, doctor or organisation, write a letter of support, or introduce us to a clinic or NGO."]],all:"All questions"},

 problem:{eye:"Das Problem",h:"Mit jedem Umzug ins Ausland fängt Ihre Krankengeschichte von vorn an",lead:"Wer in ein anderes Land zieht, hat meist Unterlagen, mit denen der neue Arzt nichts anfangen kann. Die Folge: doppelte Untersuchungen, übersehene Allergien und Fehler bei Medikamenten.",items:[["Unterlagen, die der neue Arzt nicht lesen kann","Arztbriefe, Laborberichte und Rezepte liegen auf Papier oder als PDF vor, in verschiedenen Sprachen und Schriften. Oft handschriftlich."],["Zu wenig Zeit zum Lesen", "Ein Arzt hat pro Patient nur wenige Minuten. Niemand hat Zeit, vierzig Seiten in einer Fremdsprache zu lesen. So gehen wichtige Details verloren."],["Dasselbe Medikament heißt anders","Handelsnamen, Dosierungen und Rezeptpflicht unterscheiden sich von Land zu Land. Das Etikett zu übersetzen reicht nicht."]]},
 video:{"tr":"Transkript lesen","eye": "Video", "h": "MedHarbor in 90 Sekunden", "lead": "Wie die Idee funktioniert: vom Stapel fremdsprachiger Unterlagen zu einer Karte, die Ihre Ärztin lesen kann.", "hd": "In HD herunterladen"},
 photo:{"move": "Koffer im Flur mit Reisepass und einem dicken Ordner voller Unterlagen", "visit": "Hände mit einem Smartphone am Schreibtisch einer Arztpraxis", "desk": "Medizinische Unterlagen und ein Smartphone auf einem Schreibtisch"},
 progress:{"eye": "Fortschritt", "h": "Wo das Projekt heute steht", "st": ["Erledigt", "Offen", "Als Nächstes"], "items": ["Konzept, Produktdesign und diese Website in 5 Sprachen", "Regulatorischer Ansatz festgelegt: DSGVO, MDR, EU-KI-Verordnung", "Pilotliste offen für Patienten, Ärzte und Organisationen", "Interviews mit 15 Patienten und 5 Ärzten", "Unterstützungsschreiben von Kliniken und NGOs"], "note": "Sobald die Pilotliste wächst, veröffentlichen wir hier echte Zahlen."},
 numbers:{eye:"Das Ausmaß",h:"Millionen Menschen in Europa haben eine Krankengeschichte, die ihr Arzt vor Ort nicht lesen kann",stats:[["30,6 Mio.","Nicht-EU-Bürger leben in der EU","Eurostat · 1.1.2025"],["14,1 Mio.","EU-Bürger leben in einem anderen EU-Land","Eurostat · 1.1.2025"],["4,43 Mio.","Menschen aus der Ukraine haben vorübergehenden Schutz in der EU","Eurostat · Aug. 2026"],["2029","beginnen EU-Länder, Patientenkurzakten auszutauschen, aber nur untereinander und nur digital","EHDS-Verordnung"]]},
 how:{eye:"So soll es funktionieren",h:"Von der Papierschublade zur Patientenkarte in wenigen Minuten",steps:[["Dokumente hochladen","Fotos, Scans oder PDFs in jeder Sprache, auch handschriftliche Notizen."],["Die KI liest mit","MedHarbor erkennt jedes Dokument und findet Diagnosen, Medikamente, Allergien, Laborwerte und Impfungen, jeweils mit dem internationalen medizinischen Code."],["Sie prüfen das Ergebnis","Bei jedem Eintrag sehen Sie, wie sicher sich die KI ist, und einen Link zur Originalseite. Allergien und Medikamente bestätigen Sie immer selbst."],["Mit dem Arzt teilen","Die Karte entsteht in der Sprache Ihres Arztes. Teilen Sie sie per QR-Code, zeitlich begrenztem Link oder als PDF."]]},
 demo:{eye:"Konzept-Demo",h:"So wird aus einem ukrainischen Arztbrief eine Karte für jeden Arzt",lead:"Die Demo zeigt die Grundidee des Prototyps. Klicken Sie auf den Button und wechseln Sie dann die Sprache des Arztes. Alle Daten sind erfunden.",lang:"Sprache des Arztes",run:"KI starten",running:"Dokument wird gelesen…",again:"Noch einmal",src:"Originaldokument · Ukrainisch",verified:"Geprüft",waiting:"Wartet",note:"Jeder Eintrag verweist auf die Zeile, aus der er stammt.",title:"Patientenkarte",patient:"Patient",dob:"Geburtsdatum",allergies:"Allergien",meds:"Aktuelle Medikamente",dx:"Diagnosen",labs:"Laborwerte"},
 modules:{eye:"Geplante Funktionen",h:"Ein Produkt für den ganzen Weg",items:[["Patientenkarte","Alle Unterlagen in einer Übersicht im internationalen Format Patient Summary. Zuerst Allergien und Medikamente, danach die ganze Vorgeschichte."],["Medikamente im Ausland","Geben Sie ein Medikament aus Ihrem alten Land ein. Sie sehen, welcher Wirkstoff drin ist, wie es dort heißt, wo Sie jetzt leben, und ob es rezeptpflichtig ist."],["Hilfe beim Arzttermin","Fragen vorher vorbereiten, beim Termin übersetzen lassen und danach eine Zusammenfassung in beiden Sprachen behalten."]]},
 why:{eye:"Warum jetzt",h:"Die Technik ist so weit, und Europa einigt sich auf gemeinsame Regeln",items:[["KI kann echte Dokumente lesen","Heutige KI liest Scans, Handschrift und verschiedene Alphabete für wenige Cent pro Dokument."],["Europa einigt sich auf ein Format","Der Europäische Gesundheitsdatenraum (EHDS) nutzt das International Patient Summary als gemeinsames Format. MedHarbor nutzt es von Anfang an."],["Was der EHDS nicht abdeckt","Das offizielle System verbindet nur digitale Daten innerhalb der EU. Papierakten und Unterlagen aus Nicht-EU-Ländern bleiben außen vor. Genau dafür ist MedHarbor gedacht."],["Klare Regeln für KI in der Medizin","DSGVO und EU-KI-Verordnung geben klare Regeln vor. Wir halten sie vom ersten Tag an ein."]]},
 road:{eye:"Roadmap",h:"Was die Prototyp-Phase bringen soll",lead:"In zwölf Wochen zum funktionierenden Prototyp, getestet von echten Nutzern und Ärzten. Die Ergebnisse entscheiden über den nächsten Schritt.",phases:[["Jetzt","Konzept und Prüfung","Gespräche mit Patienten und Ärzten, rechtliche Prüfung, Prototyp-Design, Partnersuche."],["Woche 1–2","Recherche und Design","15 Interviews mit Patienten und 5 mit Ärzten, 200 anonymisierte Testdokumente, Prüfung nach MDR und DSGVO."],["Woche 3–9","Bau des Prototyps","Upload, KI zum Auslesen und Ordnen der Daten, Prüfansicht, Patientenkarte in 5 Sprachen."],["Woche 10–11","Geschlossener Pilot","30–50 Nutzer und 5–10 Ärzte testen echte Karten."],["Woche 12","Ergebnisse","Ergebnisbericht, Entscheidung über die nächsten Schritte, Antrag auf weitere Förderung."]],
  kpiH:"Woran wir den Pilot messen",kcols:["Was wir messen","Ziel"],kpis:[["Genauigkeit, von einem Arzt geprüft","Mindestens 90 % korrekte Angaben, keine Fehler bei Allergien und Medikamenten"],["Nutzer, die ihre Karte fertigstellen","Mindestens 60 %"],["Ärzte, die die Karte hilfreich finden","Mindestens 7 von 10"],["Nutzer, die für Plus zahlen würden","Mindestens 20 %"],["Nutzer, die nach 30 Tagen noch aktiv sind","Mindestens 30 %"],["Absichtserklärungen von Organisationen","Mindestens 2"]],
  riskH:"Die wichtigsten Risiken und was wir dagegen tun",rcols:["Risiko","Was wir tun"],risks:[["Die KI liest wichtige Daten falsch","Der Patient prüft jeden Eintrag, jeder Eintrag verweist aufs Original, und Allergien und Medikamente werden ohne jede Fehlertoleranz getestet"],["MedHarbor gilt als Medizinprodukt","Klar begrenzter Zweck: ordnen und übersetzen, nie diagnostizieren. Rechtliche Prüfung vor dem Pilot"],["Gesundheitsdaten gelangen nach außen","Daten bleiben in der EU, Verschlüsselung, minimaler Zugriff, kein KI-Training mit Nutzerdaten, Sicherheitstest vor dem Start"],["Ärzte vertrauen der Karte nicht","Ein Format, das Ärzte kennen, Links zu den Originalen, Ärzte von Woche 1 an dabei"],["Geflüchtete können nicht zahlen","Kostenloser Zugang über NGOs und Fördermittel; Einnahmen von Expats und Organisationen"]],more:"Zur ganzen Roadmap"},
 impact:{eye:"Wirkung",h:"Wem es hilft und warum das für Europa wichtig ist",lead:"MedHarbor hilft Menschen, deren Krankengeschichte über mehrere Länder verteilt ist, und den Ärzten, die sie behandeln.",whoH:"Für wen",who:[["Geflüchtete und Vertriebene","Sie kommen oft mit Papierunterlagen in einer anderen Sprache an und brauchen zugleich akute Hilfe und langfristige Behandlung."],["Expats und Familien, die umziehen","Jeder Umzug bedeutet ein neues Gesundheitssystem. Arbeitgeber und Versicherer zahlen schon heute dafür, das einfacher zu machen."],["Menschen mit chronischen Erkrankungen","Wer Diabetes, eine Herzerkrankung oder Krebs hat, hat die meisten Unterlagen und leidet am meisten, wenn etwas fehlt."],["Familien, die aus der Ferne pflegen","Erwachsene Kinder, die von einem Land aus die Behandlung ihrer Eltern in einem anderen organisieren."],["Ärzte und Kliniken","Sie bekommen vor dem Termin eine klare Vorgeschichte statt eines Stapels unübersetzter Seiten."],["Versicherer und Behörden","Weniger doppelte Untersuchungen und weniger vermeidbare Medikationsfehler."]],alignH:"Wie es zu den Zielen der EU passt",align:[["Europäischer Gesundheitsdatenraum","Die Karten nutzen das International Patient Summary und HL7 FHIR, die Formate des EHDS."],["Gleicher Zugang zur Versorgung","Unterstützt die UN-Nachhaltigkeitsziele 3 (Gesundheit) und 10 (weniger Ungleichheit), weil Sprachbarrieren wegfallen."],["Vertrauenswürdige KI","Jedes Ergebnis ist nachprüfbar und wird von einem Menschen bestätigt, im Sinne der EU-KI-Verordnung."],["Daten bleiben in Europa","Hosting in der EU, DSGVO von Anfang an, und der Nutzer entscheidet, wer die Karte sieht."]],outH:"Was sich ändern soll",out:[["Weniger doppelte Untersuchungen","Ärzte sehen frühere Befunde, statt sie neu anzuordnen."],["Sicherere Verordnungen","Allergien und aktuelle Medikamente stehen auf der ersten Seite, in der Sprache des Arztes."],["Kürzere Anamnese","Der Arzt hat vor dem Termin eine Zusammenfassung und muss nicht alles neu erfragen."]]},
 model:{eye:"Geschäftsmodell",h:"Kostenlos für alle, die es am dringendsten brauchen",lead:"Das Modell ist ein Plan. Wir testen es im Pilot, die Preise können sich noch ändern.",streams:[["Kostenlos für Privatpersonen","Das Wichtigste: bis zu 15 Dokumente, eine Karte, eine Arztsprache."],["Plus-Abo","Rund 6–9 € im Monat: unbegrenzt Dokumente, alle Sprachen, Medikamente im Ausland, Hilfe beim Arzttermin."],["Organisationen","Lizenzen für internationale Krankenversicherer, Relocation-Dienstleister und Kliniken mit Patienten aus dem Ausland."],["Geförderter Zugang","NGOs und öffentliche Programme bezahlen, damit Geflüchtete MedHarbor kostenlos nutzen können."]],neverH:"Was wir nie tun werden",never:["Gesundheitsdaten verkaufen oder weitergeben","Werbung zeigen oder Medikamente bewerben","Provisionen von Apotheken oder Pharmafirmen annehmen"],econ:"Ein Dokument mit KI auszuwerten kostet ein paar Cent. Die eigentlichen Kosten entstehen dadurch, Nutzer zu erreichen und die Qualität zu prüfen."},
 security:{eye:"Datenschutz",h:"So werden wir Ihre Daten schützen",lead:"Gesundheitsdaten brauchen nach der DSGVO den höchsten Schutz. Hier sind unsere Zusagen für das Produkt, das wir bauen. Es existiert noch nicht.",items:[["Daten bleiben in der EU","Dokumente, ausgelesene Daten und Karten werden nur in Rechenzentren in der EU gespeichert und verarbeitet."],["Immer verschlüsselt","Daten werden bei der Speicherung und bei der Übertragung verschlüsselt."],["Ihre ausdrückliche Einwilligung","Gesundheitsdaten verarbeiten wir nur mit Ihrer ausdrücklichen Einwilligung. Sie können sie jederzeit widerrufen."],["Kein KI-Training mit Ihren Daten","Unsere KI-Anbieter dürfen Ihre Unterlagen laut Vertrag nicht zum Training nutzen."],["So wenig Zugriff wie möglich","Nur wer Zugriff braucht, bekommt ihn, und jeder Zugriff wird protokolliert. Wo möglich, werden Namen vor der KI-Verarbeitung entfernt."],["Alles mit einem Tipp löschen","Wenn Sie Ihr Konto löschen, werden alle Dokumente, Daten und Karten entfernt."],["Sie entscheiden, wer was sieht","Jede geteilte Karte läuft ab, wann Sie es wollen, und Sie können den Zugriff jederzeit entziehen."],["Unabhängige Prüfung","Datenschutz-Folgenabschätzung und unabhängiger Sicherheitstest vor jedem öffentlichen Start."]],regH:"Rechtlicher Rahmen",regCols:["Regelwerk","Was das für MedHarbor bedeutet"],reg:[["EU-MDR (Medizinprodukte)","MedHarbor ordnet, übersetzt und teilt Unterlagen. Es stellt keine Diagnosen, bewertet keine Befunde und gibt keine Therapieempfehlungen. Vor dem Pilot gibt es eine formale Prüfung."],["DSGVO, Art. 9","Ausdrückliche Einwilligung, Folgenabschätzung, nur notwendige Daten, Hosting in der EU."],["EU-KI-Verordnung","KI-generierte Inhalte werden klar gekennzeichnet, Modellversionen werden protokolliert."],["EHDS und HL7 FHIR","Die Karten nutzen das Format International Patient Summary, damit sie später mit anderen Gesundheitssystemen zusammenarbeiten können."]],note:"MedHarbor wird kein Medizinprodukt sein und keine medizinische Beratung geben."},
 concept:{eye:"Konzept",h:"Alles, was Patienten brauchen, wenn ihre Behandlung über Grenzen geht",lead:"Drei Funktionen rund um eine Patientenkarte. Der Prototyp beginnt mit der Karte.",tag:"Geplant",tabs:["Patientenkarte","Medikamente im Ausland","Hilfe beim Arzttermin"],
  card:{h:"Die Patientenkarte",p:"Alle Unterlagen an einem Ort und übersichtlich geordnet. Der Arzt sieht zuerst das Wichtigste: Allergien, aktuelle Medikamente, chronische Erkrankungen. Danach folgt die ganze Vorgeschichte.",li:["Fotos, Scans und PDFs in jeder Sprache hochladen","Die Art des Dokuments wird automatisch erkannt: Arztbrief, Laborbericht, Rezept, Impfpass","Diagnosen, Medikamente, Allergien, Laborwerte und Eingriffe werden herausgelesen","Internationale Codes: ICD-10, ATC, LOINC","Jeder Eintrag verweist auf seine Seite im Original","Teilen als PDF, per QR-Code oder zeitlich begrenztem Link"]},
  meds:{h:"Medikamente im Ausland",p:"Dasselbe Medikament kann in einem anderen Land anders heißen, anders dosiert sein oder anderen Rezeptregeln unterliegen. MedHarbor zeigt, welcher Wirkstoff in Ihrem Medikament steckt und wie es dort heißt, wo Sie jetzt leben.",li:["Suche nach Handelsname, Wirkstoff oder ATC-Code","Medikamente, die in Ihrem jetzigen Land zugelassen sind","Rezeptpflichtig oder rezeptfrei","Andere Dosis oder Darreichungsform klar markiert","Information für das Gespräch mit Arzt oder Apotheke, keine Empfehlung"],from:"Altes Rezept",ing:"Wirkstoff",to:"Erhältlich im neuen Land",rx:"Rezeptpflichtig"},
  visit:{h:"Hilfe beim Arzttermin",p:"Arzttermine sind kurz und stressig, wenn man die Sprache nicht gut spricht. Die Funktion hilft bei der Vorbereitung, übersetzt im Gespräch und hält das Wichtigste fest.",li:["Beschwerden und Fragen vorab vorbereitet und übersetzt","Übersetzung in beide Richtungen mit medizinischem Wortschatz und Text auf dem Bildschirm","Zusammenfassung in beiden Sprachen nach dem Termin","Die Zusammenfassung landet in Ihrer Karte","Audio wird live verarbeitet und standardmäßig nicht gespeichert"]}},
 funders:{eye:"Für Förderer & Partner",h:"Helfen Sie uns, MedHarbor aufzubauen",lead:"MedHarbor ist ein Projekt in der Frühphase, geführt vom Gründer. Wir suchen Fördermittel und Partner, um den Prototyp zu bauen und zu testen.",snapH:"Das Projekt auf einen Blick",snap:[["Projekt","MedHarbor, ein KI-Gesundheitspass"],["Website","medharborai.com"],["Phase","Frühphase: Konzept und Prototyp-Design"],["Gründer",FOUNDER],["Wofür die Förderung gedacht ist","Entwicklung, Design, rechtliche Prüfung, medizinische Prüfung, Pilot"],["Zeitplan","12 Wochen von der Förderzusage bis zu den Pilotergebnissen"],["Kontakt","contact@medharborai.com"]],brief:"Projektübersicht (PDF)",helpH:"Wie Sie helfen können",help:[["Fördermittel und Startfinanzierung","Finanzieren Sie den Prototyp und den ersten Pilot."],["Pilotpartner","Kliniken, Versicherer, Relocation-Dienstleister und NGOs, die Nutzer und Ärzte für den Pilot gewinnen."],["Beratung","Ärzte, Fachleute für Medizinrecht und Datenschutz, KI-Entwickler."],["Unterstützungsschreiben","Eine kurze Absichtserklärung macht unsere Förderanträge stärker."]],cta:"Gründer kontaktieren"},
 about:{eye:"Über uns",h:"Medizinische Versorgung sollte nicht an der Grenze enden",lead:"MedHarbor beginnt mit einer einfachen Beobachtung: Millionen Menschen in Europa bewahren ihre Krankengeschichte in einem Ordner auf, den kein Arzt vor Ort lesen kann. Wir bauen ein KI-Produkt, das das ändert.",founderH:"Gründer",role:"Gründer und CEO",short:"Gründer und CEO. Zuvor an KI und Interoperabilität bei SoftServe, Grammarly und Doctolib tätig. Sitz in Lwiw, Ukraine.",bio:["Pavlo Bulelik ist Gründer und CEO von MedHarbor und lebt in Lwiw, Ukraine. In fast acht Jahren hat er dort gearbeitet, wo KI auf Gesundheitswesen trifft: als Machine-Learning-Ingenieur bei SoftServe, wo er für Kunden aus dem Gesundheitswesen Daten aus gescannten klinischen Dokumenten extrahierte; im Produktbereich für NLP und generative KI bei Grammarly; und im Produktbereich für Ökosystem und Interoperabilität bei Doctolib, mit Schwerpunkt auf dem grenzüberschreitenden Austausch medizinischer Daten in Europa.", "MedHarbor hat er gegründet, um ein Problem zu lösen, das mit jedem Umzug über eine Grenze größer wird: Die Krankengeschichte bleibt zurück, und der nächste Arzt muss bei null anfangen, oft in einer Sprache, die er nicht lesen kann.", "Heute befindet sich MedHarbor in der Pre-Seed-Phase: Konzept und Design der Patientenkarte stehen, Domain und Unternehmensseite sind eingerichtet, und der nächste Schritt ist ein erster Prototyp auf Basis echter medizinischer Dokumente, getragen von Fördermitteln."],buildH:"Das Team entsteht",buildLead:"Im Moment leitet der Gründer MedHarbor allein. Wir suchen Beraterinnen und Berater sowie die ersten Teammitglieder für den Prototyp.",open:"Offene Rolle",roles:[["Medizinische Beratung","Eine Ärztin oder ein Arzt aus der Praxis prüft die Karte und den medizinischen Wortschatz."],["Beratung zu Recht und Datenschutz","Unterstützung bei MDR, DSGVO und EU-KI-Verordnung."],["KI- und Full-Stack-Entwicklung","Baut den Prototyp und die KI, die Dokumente liest."]],missionH:"Mission",mission:"Die Krankengeschichte jedes Menschen soll für jeden Arzt überall in wenigen Minuten verständlich sein.",principlesH:"Unsere Grundsätze",principles:[["Nachprüfbar statt nur überzeugend","Eine Zusammenfassung ohne Quelle ist schlechter als gar keine. Jeder Eintrag verweist auf das Original."],["Ordnen, nie diagnostizieren","MedHarbor ordnet und übersetzt. Medizinische Entscheidungen treffen Patienten und Ärzte."],["Datenschutz von Anfang an","Hosting in der EU, ausdrückliche Einwilligung und Löschen mit einem Tipp gehören zum Produkt, nicht ins Kleingedruckte."],["Internationale Standards","Wir nutzen FHIR und das International Patient Summary, damit die Karten zu den Systemen der Ärzte passen."]]},
 faq:{eye:"Fragen",h:"Häufige Fragen",items:[["Gibt es MedHarbor schon?","Noch nicht. Wir sind in der Konzept- und Designphase und beantragen Fördermittel, um den Prototyp zu bauen und einen geschlossenen Pilot durchzuführen. In die Pilotliste können Sie sich schon heute eintragen."],["Wird MedHarbor ein Medizinprodukt?","Nein. MedHarbor soll Menschen helfen, ihre eigenen medizinischen Unterlagen zu ordnen, zu übersetzen und zu teilen. Es wird keine Diagnosen stellen, keine Befunde bewerten und keine Behandlung empfehlen."],["Wie stellen Sie sicher, dass die Angaben stimmen?","Bei jedem Eintrag sehen Sie, wie sicher sich die KI ist, und einen Link zur Quelle. Sie prüfen die Karte, bevor Sie sie teilen. Allergien und Medikamente bestätigen Sie immer selbst. Den Prototyp testen wir mit Dokumenten, die ein Arzt geprüft hat."],["Welche Sprachen sind geplant?","Zum Start liest MedHarbor Dokumente auf Ukrainisch, Englisch, Deutsch, Französisch und Spanisch und erstellt Karten in denselben fünf Sprachen. Weitere Sprachen folgen je nach Nachfrage."],["Wie werden meine Daten geschützt?","Die Daten bleiben in der EU und werden verschlüsselt. Wir verarbeiten sie nur mit Ihrer Einwilligung, nutzen sie nie zum KI-Training, und Sie können alles mit einem Tipp löschen. Mehr dazu unter Datenschutz."],["Wie wird das Projekt finanziert?","Wir beantragen europäische und nationale Fördermittel für Innovation und digitale Gesundheit. Förderer und Partner können sich direkt an den Gründer wenden."],["Wie kann ich helfen?","Machen Sie als Patient, Arzt oder Organisation beim Pilot mit, schreiben Sie ein Unterstützungsschreiben oder stellen Sie uns einer Klinik oder NGO vor."]],all:"Alle Fragen"},
 cta:{h:"Helfen Sie uns, MedHarbor aufzubauen",p:"Tragen Sie sich als Patient, Arzt oder Organisation in die Pilotliste ein. Jede Anmeldung zeigt Förderern, dass es dieses Problem wirklich gibt.",b:"Am Pilot teilnehmen",b2:"Für Förderer"},
 pilot:{eye:"Am Pilot teilnehmen",h:"Machen Sie beim ersten Pilot mit",lead:"Hinterlassen Sie Ihre Kontaktdaten. Wir melden uns, sobald der Prototyp getestet werden kann. Kostenlos und unverbindlich.",role:"Ich bin",roles:["Patient oder Angehörige(r)","Ärztin, Arzt oder andere Fachkraft im Gesundheitswesen","Eine Organisation (Klinik, Versicherer, NGO, Relocation-Dienstleister)","Förderer oder Investor","Etwas anderes"],name:"Name",email:"E-Mail",country:"Land, in dem Sie leben",langs:"Sprachen Ihrer medizinischen Unterlagen",msg:"Nachricht (optional)",consent:"Ich bin einverstanden, dass MedHarbor diese Angaben speichert, um mich zum Pilot zu kontaktieren. Details stehen in der",consentLink:"Datenschutzerklärung",send:"In die Pilotliste eintragen",sent:"Vielen Dank! Sie stehen auf der Pilotliste. Wir schreiben Ihnen, sobald die Tests beginnen.",nextH:"Was nach Ihrer Anmeldung passiert",next:["Wir bestätigen Ihre Anmeldung per E-Mail.", "Sobald die Finanzierung steht, bauen wir den Prototyp. Das dauert etwa 12 Wochen.", "Wir laden Sie zum Testen ein und fragen nach Ihrer Meinung."],auto:"Vielen Dank für Ihre Anmeldung zur MedHarbor-Pilotliste. Wir schreiben Ihnen, sobald die Tests beginnen. MedHarbor, medharborai.com",auto2:"Vielen Dank für Ihre Nachricht an MedHarbor. Wir antworten Ihnen bald per E-Mail. MedHarbor, medharborai.com",sending:"Wird gesendet…",openApp:"E-Mail-Programm öffnen",mailNote:"Ihr E-Mail-Programm sollte sich jetzt mit der fertigen Nachricht öffnen. Klicken Sie dort auf Senden. Bisher wurde nichts verschickt.",mailHint:"Ein Klick öffnet Ihr E-Mail-Programm mit der ausgefüllten Nachricht. Abschicken müssen Sie sie selbst.",gmail:"In Gmail öffnen",copyText:"Nachricht kopieren",noApp:"Kein E-Mail-Programm geöffnet?",copied2:"Nachricht kopiert. Fügen Sie sie in eine neue E-Mail ein an",fail:"Die Nachricht konnte nicht gesendet werden. Bitte versuchen Sie es noch einmal oder schreiben Sie an contact@medharborai.com.",btns:["In die Pilotliste eintragen", "In die Pilotliste eintragen", "Partnerschaft besprechen", "Gründer kontaktieren", "Nachricht senden"],sentMsg:"Vielen Dank! Wir haben Ihre Nachricht erhalten und antworten Ihnen per E-Mail.",consent2:"Ich bin einverstanden, dass MedHarbor diese Angaben speichert, um auf meine Nachricht zu antworten. Details stehen in der",org:"Organisation",err:"Bitte korrigieren Sie die markierten Felder.",vName:"Bitte geben Sie Ihren Namen ein: nur Buchstaben, mindestens 2.",vEmail:"Bitte geben Sie eine gültige E-Mail-Adresse ein, z. B. name@beispiel.de.",vCountry:"Bitte wählen Sie Ihr Land.",vOrg:"Bitte geben Sie den Namen Ihrer Organisation ein.",vMsg:"Die Nachricht darf höchstens 1000 Zeichen lang sein und keine < oder > enthalten.",vConsent:"Bitte setzen Sie das Häkchen bei der Einwilligung.",pickCountry:"Land wählen",langsHint:"Alle zutreffenden auswählen",other:"Andere",direct:"Fragen? Schreiben Sie dem Gründer",copy:"Kopieren",copied:"Kopiert",whyH:"Warum mitmachen",why:[["Patienten und Familien","Testen Sie die Karte als Erste mit Ihren eigenen Unterlagen, kostenlos."],["Ärzte","Bestimmen Sie mit, was die Karte zeigt und wie sie aussieht."],["Organisationen","Planen Sie mit uns einen Pilot für Ihre Mitglieder, Mitarbeitenden oder Kunden."],["Förderer","Erhalten Sie die Pilotergebnisse und die vollständige Projektbeschreibung."]]},
 legal:{privacy:{h:"Datenschutzerklärung",u:"Stand: November 2026",s:[["Verantwortlich",FOUNDER+", Gründer des Projekts MedHarbor (medharborai.com). Kontakt: contact@medharborai.com."],["Welche Daten diese Website erhebt","Nur das, was Sie uns über das Pilotformular oder per E-Mail schicken: Name, E-Mail, Land, Rolle, Sprachen Ihrer Unterlagen und Ihre Nachricht. Gesundheitsdaten erhebt diese Website nicht. Das Formular verschickt nichts von dieser Website aus: Es öffnet Ihr E-Mail-Programm mit einer fertigen Nachricht, und sie erreicht uns erst, wenn Sie auf Senden klicken."],["Wozu","Um Sie zum MedHarbor-Pilot und zu Neuigkeiten aus dem Projekt zu kontaktieren. Rechtsgrundlage: Ihre Einwilligung (Art. 6 Abs. 1 lit. a DSGVO)."],["Wie lange","Bis der Pilot endet oder bis Sie die Löschung verlangen, je nachdem, was zuerst eintritt."],["Ihre Rechte","Sie können Auskunft, Berichtigung, Löschung, Einschränkung und Übertragung Ihrer Daten verlangen, der Verarbeitung widersprechen und Ihre Einwilligung jederzeit widerrufen. Schreiben Sie an contact@medharborai.com. Sie können sich auch bei Ihrer Datenschutzbehörde beschweren."],["Die künftige App","Die MedHarbor-App gibt es noch nicht. Vor dem Start bekommt sie eine eigene Datenschutzerklärung für Gesundheitsdaten."]]},imprint:{h:"Impressum",u:"",s:[["Verantwortlich für den Inhalt",FOUNDER+", Gründer des Projekts MedHarbor"],["Kontakt","contact@medharborai.com"],["Unternehmensangaben","MedHarbor ist noch nicht als Unternehmen eingetragen. Die Angaben folgen hier nach der Eintragung."]]}},

 hero:{h:"Tout votre dossier médical. <em>Dans la langue de votre médecin.</em>",lead:"Importez vos comptes rendus d'hospitalisation, résultats d'analyses et ordonnances, de n'importe quel pays et dans n'importe quelle langue. MedHarbor en fera une fiche patient claire, que tout médecin pourra lire en quelques secondes.",c1:"Rejoindre le pilote",c2:"Financeurs & partenaires",n1:"Hébergement prévu dans l'UE",n2:"Pensé pour respecter le RGPD",n3:"Chaque information reliée à l'original",concept:"Aperçu du concept",card:"Fiche patient",allergy:"Allergie",med:"Traitement",dx:"Diagnostic",sources:"Sources",docs:"4 documents"},

 problem:{eye:"Le problème",h:"À chaque déménagement à l'étranger, votre dossier médical repart de zéro",lead:"Quand on s'installe dans un autre pays, le nouveau médecin ne peut pas exploiter l'ancien dossier médical. Résultat : examens refaits, allergies oubliées, erreurs de traitement.",items:[["Des documents que le nouveau médecin ne peut pas lire","Comptes rendus, bilans et ordonnances sur papier ou en PDF, dans différentes langues et différents alphabets. Souvent manuscrits."],["Trop peu de temps pour les lire", "Un médecin n'a que quelques minutes par patient. Personne n'a le temps de lire quarante pages dans une langue étrangère. Des informations importantes passent donc à la trappe."],["Le même médicament porte un autre nom","Noms de marque, dosages et règles de prescription changent d'un pays à l'autre. Traduire l'étiquette ne suffit pas."]]},

 photo:{"move": "Une valise dans une entrée, avec un passeport et un épais dossier de documents", "visit": "Des mains tenant un smartphone sur le bureau d'un médecin", "desk": "Des documents médicaux et un smartphone sur un bureau"},
 progress:{"eye": "Avancement", "h": "Où en est le projet aujourd'hui", "st": ["Fait", "Ouvert", "Prochaine étape"], "items": ["Concept, design du produit et ce site en 5 langues", "Approche réglementaire définie : RGPD, MDR, règlement européen sur l'IA", "Liste du pilote ouverte aux patients, médecins et organisations", "Entretiens avec 15 patients et 5 médecins", "Lettres de soutien de cliniques et d'ONG"], "note": "Nous publierons ici de vrais chiffres à mesure que la liste du pilote grandit."},
 numbers:{eye:"L'ampleur",h:"Des millions de personnes en Europe ont un dossier médical que leur médecin ne peut pas lire",stats:[["30,6 M","de ressortissants de pays tiers vivent dans l'UE","Eurostat · 1er janv. 2025"],["14,1 M","de citoyens de l'UE vivent dans un autre pays de l'UE","Eurostat · 1er janv. 2025"],["4,43 M","de personnes venues d'Ukraine bénéficient de la protection temporaire dans l'UE","Eurostat · août 2026"],["2029","les pays de l'UE commenceront à échanger des résumés patient, mais seulement entre eux et seulement sous forme numérique","Règlement EHDS"]]},
 how:{eye:"Comment ça fonctionnera",h:"D'un tiroir plein de papiers à une seule fiche, en quelques minutes",steps:[["Importez vos documents","Photos, scans ou PDF, dans n'importe quelle langue, même manuscrits."],["L'IA les lit","MedHarbor reconnaîtra chaque document et repérera diagnostics, traitements, allergies, résultats d'analyses et vaccins, avec leurs codes médicaux internationaux."],["Vous vérifiez","Pour chaque information, vous voyez à quel point l'IA est sûre d'elle, et un lien vers la page d'origine. Les allergies et les traitements, c'est toujours vous qui les confirmez."],["Partagez avec votre médecin","La fiche est rédigée dans la langue du médecin. Partagez-la par QR code, par lien temporaire ou en PDF."]]},
 demo:{eye:"Démo du concept",h:"Un compte rendu ukrainien devient une fiche lisible par tout médecin",lead:"Cette démo montre l'idée de base du prototype. Cliquez sur le bouton, puis changez la langue du médecin. Toutes les données sont fictives.",lang:"Langue du médecin",run:"Lancer l'IA",running:"Lecture du document…",again:"Relancer",src:"Document d'origine · ukrainien",verified:"Vérifiée",waiting:"En attente",note:"Chaque information renvoie à la ligne d'où elle vient.",title:"Fiche patient",patient:"Patient",dob:"Date de naissance",allergies:"Allergies",meds:"Traitement en cours",dx:"Diagnostics",labs:"Résultats d'analyses"},
 modules:{eye:"Fonctions prévues",h:"Un seul outil pour tout le parcours",items:[["Fiche patient","Tous vos documents réunis dans un résumé au format international Patient Summary. D'abord les allergies et les traitements, ensuite tout l'historique."],["Médicaments à l'étranger","Saisissez le nom d'un médicament de votre ancien pays. Vous voyez sa substance active, son nom là où vous vivez maintenant, et s'il faut une ordonnance."],["Aide en consultation","Préparez vos questions, faites traduire la consultation et gardez ensuite un résumé dans les deux langues."]]},
 why:{eye:"Pourquoi maintenant",h:"La technologie est prête et l'Europe se dote de règles communes",items:[["L'IA sait lire de vrais documents","L'IA actuelle lit les scans, l'écriture manuscrite et différents alphabets, pour quelques centimes par document."],["L'Europe adopte un format commun","L'Espace européen des données de santé (EHDS) utilise l'International Patient Summary comme format commun. MedHarbor l'utilisera dès le départ."],["Ce que l'EHDS ne couvre pas","Le système officiel ne reliera que les données numériques au sein de l'UE. Les dossiers papier et les documents venant de pays hors UE restent de côté. C'est précisément pour ces cas que MedHarbor est conçu."],["Des règles claires pour l'IA en santé","Le RGPD et le règlement européen sur l'IA fixent des règles claires. Nous les appliquons dès le premier jour."]]},
 road:{eye:"Feuille de route",h:"Ce que la phase prototype doit apporter",lead:"Douze semaines pour arriver à un prototype qui fonctionne, testé par de vrais utilisateurs et des médecins. Les résultats décideront de la suite.",phases:[["Aujourd'hui","Concept et validation","Échanges avec des patients et des médecins, vérification juridique, conception du prototype, recherche de partenaires."],["Semaines 1–2","Recherche et design","15 entretiens avec des patients et 5 avec des médecins, 200 documents de test anonymisés, analyse MDR et RGPD."],["Semaines 3–9","Construction du prototype","Import des documents, IA qui lit et classe les données, écran de vérification, fiche en 5 langues."],["Semaines 10–11","Pilote fermé","30 à 50 utilisateurs et 5 à 10 médecins testent de vraies fiches."],["Semaine 12","Résultats","Bilan chiffré, décision sur la suite, demande de financement complémentaire."]],
  kpiH:"Comment nous évaluerons le pilote",kcols:["Ce que nous mesurons","Objectif"],kpis:[["Exactitude, vérifiée par un médecin","Au moins 90 % d'informations exactes, aucune erreur sur les allergies et les traitements"],["Utilisateurs qui terminent leur fiche","Au moins 60 %"],["Médecins qui jugent la fiche utile","Au moins 7 sur 10"],["Utilisateurs prêts à payer l'offre Plus","Au moins 20 %"],["Utilisateurs encore actifs après 30 jours","Au moins 30 %"],["Lettres d'intention d'organisations","Au moins 2"]],
  riskH:"Les principaux risques et nos réponses",rcols:["Risque","Ce que nous faisons"],risks:[["L'IA se trompe sur une donnée importante","Le patient vérifie chaque information, chaque information renvoie à l'original, et les allergies et traitements sont testés sans aucune tolérance d'erreur"],["MedHarbor est classé dispositif médical","Un usage clairement limité : organiser et traduire, jamais diagnostiquer. Vérification juridique avant le pilote"],["Fuite de données de santé","Données hébergées dans l'UE, chiffrement, accès minimal, pas d'entraînement de l'IA sur les données, test de sécurité avant le lancement"],["Les médecins ne font pas confiance à la fiche","Un format qu'ils connaissent, des liens vers les originaux, des médecins impliqués dès la première semaine"],["Les réfugiés ne peuvent pas payer","Accès gratuit financé par des ONG et des subventions ; revenus venant des expatriés et des organisations"]],more:"Voir toute la feuille de route"},
 impact:{eye:"Impact",h:"À qui cela sert, et pourquoi c'est important pour l'Europe",lead:"MedHarbor aide les personnes dont le dossier médical est éparpillé entre plusieurs pays, ainsi que les médecins qui les soignent.",whoH:"Pour qui",who:[["Réfugiés et personnes déplacées","Ils arrivent souvent avec des documents papier dans une autre langue et ont besoin à la fois de soins urgents et d'un suivi au long cours."],["Expatriés et familles qui déménagent","Chaque déménagement implique un nouveau système de santé. Employeurs et assureurs paient déjà pour simplifier cette étape."],["Personnes atteintes de maladies chroniques","Diabète, maladie cardiaque, cancer : ces patients ont le plus de documents et sont les premiers touchés quand une information manque."],["Familles qui accompagnent un proche à distance","Des enfants adultes qui organisent, depuis un pays, les soins de leurs parents dans un autre."],["Médecins et cliniques","Ils reçoivent un historique clair avant la consultation, au lieu d'une pile de pages non traduites."],["Assureurs et services publics","Moins d'examens en double et moins d'erreurs de traitement évitables."]],alignH:"En phase avec les priorités de l'UE",align:[["Espace européen des données de santé","Les fiches utilisent l'International Patient Summary et HL7 FHIR, les formats retenus pour l'EHDS."],["Égalité d'accès aux soins","Contribue aux objectifs de développement durable 3 (santé) et 10 (inégalités réduites) en levant la barrière de la langue."],["Une IA digne de confiance","Chaque résultat peut être vérifié et est confirmé par une personne, conformément au règlement européen sur l'IA."],["Des données qui restent en Europe","Hébergement dans l'UE, RGPD dès la conception, et c'est l'utilisateur qui décide qui voit sa fiche."]],outH:"Ce que nous voulons changer",out:[["Moins d'examens en double","Les médecins voient les résultats précédents au lieu de les redemander."],["Des prescriptions plus sûres","Allergies et traitements en cours figurent en première page, dans la langue du médecin."],["Des consultations plus efficaces","Le médecin dispose d'un résumé avant la consultation et n'a pas à tout redemander."]]},
 model:{eye:"Modèle économique",h:"Gratuit pour ceux qui en ont le plus besoin",lead:"Ce modèle est un projet. Nous le testerons pendant le pilote, et les prix peuvent encore évoluer.",streams:[["Gratuit pour les particuliers","L'essentiel : jusqu'à 15 documents, une fiche, une langue de médecin."],["Abonnement Plus","Environ 6 à 9 € par mois : documents illimités, toutes les langues, médicaments à l'étranger, aide en consultation."],["Organisations","Licences pour les assureurs santé internationaux, les sociétés de mobilité internationale et les cliniques qui accueillent des patients étrangers."],["Accès financé","Des ONG et des programmes publics paient pour que les réfugiés utilisent MedHarbor gratuitement."]],neverH:"Ce que nous ne ferons jamais",never:["Vendre ou partager des données de santé","Afficher de la publicité ou promouvoir des médicaments","Toucher des commissions de pharmacies ou de laboratoires"],econ:"Traiter un document avec l'IA coûte quelques centimes. Les vrais coûts, ce sont la recherche d'utilisateurs et le contrôle de la qualité."},
 security:{eye:"Données & sécurité",h:"Comment nous protégerons vos données",lead:"Le RGPD impose la plus haute protection pour les données de santé. Voici nos engagements pour le produit que nous construisons. Il n'existe pas encore.",items:[["Données hébergées dans l'UE","Documents, données extraites et fiches seront stockés et traités uniquement dans des centres de données situés dans l'UE."],["Toujours chiffrées","Les données seront chiffrées lors du stockage comme lors de leur transmission."],["Votre consentement explicite","Nous ne traiterons vos données de santé qu'avec votre consentement explicite, que vous pourrez retirer à tout moment."],["Pas d'entraînement de l'IA sur vos données","Par contrat, nos fournisseurs d'IA n'auront pas le droit d'utiliser vos documents pour entraîner leurs modèles."],["Accès limité au strict nécessaire","Seules les personnes qui en ont besoin y auront accès, et chaque accès sera enregistré. Quand c'est possible, les noms seront retirés avant le traitement par l'IA."],["Tout supprimer en un geste","En supprimant votre compte, vous effacez tous vos documents, données et fiches."],["Vous décidez du partage","Chaque fiche partagée expire quand vous le décidez, et vous pouvez retirer l'accès à tout moment."],["Contrôles indépendants","Analyse d'impact sur la protection des données et test de sécurité indépendant avant tout lancement public."]],regH:"Cadre juridique",regCols:["Texte","Ce que cela implique pour MedHarbor"],reg:[["MDR (dispositifs médicaux)","MedHarbor organise, traduit et partage des documents. Il ne pose pas de diagnostic, n'interprète pas les résultats et ne donne pas de conseil de traitement. Une vérification formelle aura lieu avant le pilote."],["RGPD, article 9","Consentement explicite, analyse d'impact, uniquement les données nécessaires, hébergement dans l'UE."],["Règlement européen sur l'IA","Les contenus générés par l'IA sont clairement signalés et les versions des modèles sont enregistrées."],["EHDS et HL7 FHIR","Les fiches utilisent le format International Patient Summary pour pouvoir, plus tard, fonctionner avec d'autres systèmes de santé."]],note:"MedHarbor ne sera pas un dispositif médical et ne donnera pas de conseil médical."},
 concept:{eye:"Concept",h:"Tout ce dont un patient a besoin quand ses soins passent une frontière",lead:"Trois fonctions autour d'une seule fiche patient. Le prototype commence par la fiche.",tag:"Prévu",tabs:["Fiche patient","Médicaments à l'étranger","Aide en consultation"],
  card:{h:"La fiche patient",p:"Tous vos documents au même endroit, clairement organisés. Le médecin voit d'abord l'essentiel : allergies, traitement en cours, maladies chroniques. Puis tout l'historique.",li:["Importez photos, scans et PDF dans n'importe quelle langue","Le type de document est reconnu automatiquement : compte rendu, bilan, ordonnance, carnet de vaccination","Diagnostics, traitements, allergies, résultats et interventions sont repérés","Codes internationaux : CIM-10, ATC, LOINC","Chaque information renvoie à sa page dans l'original","Partage en PDF, par QR code ou par lien temporaire"]},
  meds:{h:"Médicaments à l'étranger",p:"Un même médicament peut changer de nom, de dosage ou de règle de prescription d'un pays à l'autre. MedHarbor montrera quelle substance contient votre médicament et sous quel nom il est vendu là où vous vivez.",li:["Recherche par nom de marque, substance active ou code ATC","Médicaments autorisés dans votre pays actuel","Sur ordonnance ou en vente libre","Dosage ou forme différents clairement signalés","Une information à discuter avec un médecin ou un pharmacien, pas une recommandation"],from:"Ancienne ordonnance",ing:"Substance active",to:"Vendu dans le nouveau pays",rx:"Sur ordonnance"},
  visit:{h:"Aide en consultation",p:"Une consultation est courte et stressante quand on ne parle pas bien la langue. Cette fonction vous aidera à vous préparer, traduira pendant l'échange et en gardera une trace.",li:["Symptômes et questions préparés et traduits avant la visite","Traduction dans les deux sens, avec vocabulaire médical et texte à l'écran","Résumé dans les deux langues après la consultation","Le résumé est ajouté à votre fiche","Le son est traité en direct et n'est pas conservé par défaut"]}},
 funders:{eye:"Financeurs & partenaires",h:"Aidez-nous à construire MedHarbor",lead:"MedHarbor est un projet en phase de démarrage, porté par son fondateur. Nous cherchons des subventions et des partenaires pour construire et tester le prototype.",snapH:"Le projet en bref",snap:[["Projet","MedHarbor, un passeport médical basé sur l'IA"],["Site","medharborai.com"],["Stade","Démarrage : concept et conception du prototype"],["Fondateur",FOUNDER],["Le financement servira à","Développement, design, vérification juridique, relecture médicale, pilote"],["Calendrier","12 semaines entre le financement et les résultats du pilote"],["Contact","partnerships@medharborai.com"]],brief:"Présentation du projet (PDF)",helpH:"Comment nous aider",help:[["Subventions et financement d'amorçage","Financer le prototype et le premier pilote."],["Partenaires du pilote","Cliniques, assureurs, sociétés de mobilité internationale et ONG capables d'amener des utilisateurs et des médecins."],["Conseillers","Médecins, spécialistes du droit de la santé et de la protection des données, ingénieurs en IA."],["Lettres de soutien","Une courte lettre d'intention renforce nos demandes de subvention."]],cta:"Contacter le fondateur"},
 about:{eye:"À propos",h:"Les soins ne devraient pas s'arrêter à la frontière",lead:"MedHarbor part d'un constat simple : des millions de personnes en Europe gardent leur dossier médical dans une pochette de papiers qu'aucun médecin sur place ne peut lire. Nous construisons un produit d'IA pour changer cela.",founderH:"Fondateur",role:"Fondateur et CEO",short:"Fondateur et CEO. Auparavant sur l'IA et l'interopérabilité chez SoftServe, Grammarly et Doctolib. Basé à Lviv, en Ukraine.",bio:["Pavlo Bulelik est le fondateur et CEO de MedHarbor. Il vit à Lviv, en Ukraine. En près de huit ans, il a travaillé là où l'IA rencontre la santé : ingénieur en machine learning chez SoftServe, où il extrayait des données de documents cliniques numérisés pour des clients du secteur de la santé ; côté produit (NLP et IA générative) chez Grammarly ; puis côté produit (écosystème et interopérabilité) chez Doctolib, sur l'échange transfrontalier de données médicales en Europe.", "Il a fondé MedHarbor pour résoudre un problème qui s'aggrave à chaque déménagement à l'étranger : le dossier médical reste derrière soi, et le médecin suivant doit repartir de zéro, souvent dans une langue qu'il ne lit pas.", "Aujourd'hui, MedHarbor en est au stade pré-amorçage : le concept et la conception de la fiche patient sont prêts, le domaine et la page de l'entreprise sont en place, et la prochaine étape est un premier prototype construit sur de vrais documents médicaux, soutenu par des subventions."],buildH:"Une équipe en construction",buildLead:"Pour l'instant, MedHarbor est porté par son fondateur. Nous cherchons des conseillers et les premiers membres de l'équipe pour le prototype.",open:"Poste ouvert",roles:[["Conseiller médical","Un médecin en exercice pour relire la fiche et le vocabulaire médical."],["Conseiller juridique et protection des données","Accompagnement sur le MDR, le RGPD et le règlement européen sur l'IA."],["Ingénieur IA et full-stack","Construit le prototype et l'IA qui lit les documents."]],missionH:"Notre mission",mission:"Rendre le dossier médical de chacun compréhensible pour n'importe quel médecin, partout, en quelques minutes.",principlesH:"Nos principes",principles:[["Vérifiable avant tout","Un résumé sans source vaut moins que pas de résumé du tout. Chaque information renvoie à l'original."],["Organiser, jamais diagnostiquer","MedHarbor classe et traduit. Les décisions médicales reviennent aux patients et aux médecins."],["La confidentialité au cœur du produit","Hébergement dans l'UE, consentement explicite et suppression en un geste font partie du produit, pas des petites lignes."],["Des standards internationaux","Nous utilisons FHIR et l'International Patient Summary pour que les fiches puissent fonctionner avec les outils des médecins."]]},
 faq:{eye:"Questions",h:"Questions fréquentes",items:[["MedHarbor existe-t-il déjà ?","Pas encore. Nous en sommes au concept et à la conception du prototype. Nous demandons des subventions pour construire le prototype et mener un pilote fermé. Vous pouvez dès maintenant vous inscrire au pilote."],["MedHarbor sera-t-il un dispositif médical ?","Non. MedHarbor aidera chacun à organiser, traduire et partager ses propres documents médicaux. Il ne posera pas de diagnostic, n'interprétera pas les résultats et ne recommandera aucun traitement."],["Comment garantir que les informations sont justes ?","Pour chaque information, vous verrez à quel point l'IA est sûre d'elle, et un lien vers la source. Vous vérifiez la fiche avant de la partager. Les allergies et les traitements, c'est toujours vous qui les confirmez. Nous testerons le prototype sur des documents vérifiés par un médecin."],["Quelles langues sont prévues ?","Au lancement, MedHarbor lira les documents en ukrainien, anglais, allemand, français et espagnol, et créera des fiches dans ces cinq langues. D'autres suivront selon la demande."],["Comment mes données seront-elles protégées ?","Elles restent dans l'UE et sont chiffrées. Nous ne les traitons qu'avec votre consentement, elles ne servent jamais à entraîner une IA, et vous pouvez tout supprimer en un geste. Plus de détails dans la rubrique Données & sécurité."],["Comment le projet est-il financé ?","Nous demandons des subventions européennes et nationales pour l'innovation et la santé numérique. Les financeurs et partenaires peuvent écrire directement au fondateur."],["Comment puis-je aider ?","Rejoignez le pilote en tant que patient, médecin ou organisation, écrivez une lettre de soutien, ou mettez-nous en contact avec une clinique ou une ONG."]],all:"Toutes les questions"},
